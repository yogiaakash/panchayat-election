name: Build Candidate Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-candidate/**"
      - ".github/workflows/android-candidate-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-candidate
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Panchayat-Digital-Candidate-Test-APK
          path: android-candidate/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
