name: Build PanchayatX Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-candidate/**"
      - ".github/workflows/android-candidate-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-candidate
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build installable debug APK
        run: |
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/PanchayatX.apk
      - name: Upload PanchayatX APK
        uses: actions/upload-artifact@v4
        with:
          name: PanchayatX-Android-APK
          path: android-candidate/app/build/outputs/apk/debug/PanchayatX.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest PanchayatX APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: panchayatx-android-latest
          name: PanchayatX Android APK
          body: |
            Latest installable PanchayatX Android APK.
            Opens the live PanchayatX candidate login and dashboard.
          files: android-candidate/app/build/outputs/apk/debug/PanchayatX.apk
          overwrite_files: true
          make_latest: true
