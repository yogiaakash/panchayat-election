<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panchayat Digital</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--p:#176451;--p2:#0f4f40;--bg:#f3f7f5;--card:#fff;--text:#17342c;--muted:#687b75;--line:#d9e7e1;--mint:#eaf5f1}
*{box-sizing:border-box}body{margin:0;font-family:Inter,"Noto Sans Devanagari",Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,var(--p2),var(--p));color:#fff;border-bottom:0;padding:15px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;box-shadow:0 3px 14px #0b3b3028}
.brand{font-weight:900;font-size:21px;color:#fff;letter-spacing:.2px}main{max-width:1180px;margin:24px auto;padding:0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 7px 22px #17342c0b}
.login{max-width:420px;margin:70px auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat strong{display:block;font-size:28px;color:var(--p)}.stat span,.muted{color:var(--muted)}
input,select,button{font:inherit}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff}label{display:block;margin:12px 0 5px;font-weight:700}.btn{border:0;border-radius:10px;padding:11px 15px;cursor:pointer}.primary{background:var(--p);color:#fff;font-weight:800}.ghost{background:var(--mint);color:var(--p2);font-weight:800}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;gap:9px;margin:14px 0}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left}th{background:#f8fafc}.tablewrap{overflow:auto}.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,var(--p2),var(--p));color:#fff;border:0}.hero .muted{color:#d6eee6}.hero img{width:82px;height:82px;object-fit:cover;border-radius:50%;border:3px solid #fff;box-shadow:0 3px 10px #0003}.error{color:#b42318}.ok{color:#067647}.hidden{display:none}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.hero{align-items:flex-start}}
@media print{header,.filters,.noprint{display:none!important}body{background:#fff}.card{box-shadow:none;border:0}main{margin:0;max-width:none}}
</style>
<style>
main{max-width:850px}.hero{border-radius:18px}.filters{grid-template-columns:1fr 1fr 1fr!important}.cards{display:grid;gap:10px}.vcard{padding:13px}.vtop{display:flex;justify-content:space-between;gap:8px}.vname{font-size:18px;font-weight:900}.vid{font:700 11px monospace;background:#eef3f1;padding:5px 7px;border-radius:8px;height:max-content}.vrel{font-size:13px;color:#53625c;margin-top:4px}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.pill{font-size:11px;background:#f2f5f3;border:1px solid #e0e6e3;padding:5px 7px;border-radius:999px}.housepill{background:#fff7e9;color:#795018}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.family{display:none;padding:14px;margin:12px 0}.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin:14px}.pager button{background:#fff;border:1px solid #cad3cf;border-radius:10px;padding:9px;font-weight:800}dialog{width:min(94vw,560px);border:0;border-radius:18px}.drow{display:grid;grid-template-columns:120px 1fr;padding:8px 0;border-bottom:1px solid #eee}.drow span{font-size:11px;color:#6f7b76}@media(min-width:650px){.cards{grid-template-columns:1fr 1fr}}@media(max-width:649px){.filters{grid-template-columns:1fr!important}}
</style></head>
<body>
<header><div class="brand">Panchayat Digital</div><button id="logout" class="btn ghost hidden">Logout</button></header>
<main id="app"></main>
<script>
const SUPABASE_URL="https://ieoltipygxawhsvlxnsj.supabase.co", SUPABASE_PUBLISHABLE_KEY="sb_publishable_AzM0AxHgmX2a6-9On5jgNg_7SuasTXH";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const app=document.getElementById("app"), logout=document.getElementById("logout");
let candidate=null,voters=[],page=1; const PER=40;

const DEV_TO_LAT={"क":"k","ख":"kh","ग":"g","घ":"gh","च":"ch","छ":"chh","ज":"j","झ":"jh","ट":"t","ठ":"th","ड":"d","ढ":"dh","त":"t","थ":"th","द":"d","ध":"dh","न":"n","प":"p","फ":"ph","ब":"b","भ":"bh","म":"m","य":"y","र":"r","ल":"l","व":"v","श":"sh","ष":"sh","स":"s","ह":"h","ा":"a","ि":"i","ी":"i","ु":"u","ू":"u","े":"e","ै":"ai","ो":"o","ौ":"au","ं":"n","ँ":"n","ः":"h","्":""};
function latinize(v){return String(v??"").split("").map(ch=>DEV_TO_LAT[ch]??ch).join("").toLowerCase().replace(/[^a-z0-9]+/g," ").trim()}
const e=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function loginView(msg=""){
 logout.classList.add("hidden");
 app.innerHTML=`<div class="card login"><h2>Candidate Login</h2><p class="muted">अपने अधिकृत Email और Password से लॉगिन करें।</p>
 <label>Email</label><input id="email" type="email" autocomplete="username">
 <label>Password</label><input id="password" type="password" autocomplete="current-password">
 <button class="btn primary" style="width:100%;margin-top:16px" onclick="signIn()">Login</button>
 <p id="msg" class="error">${e(msg)}</p></div>`;
}
async function signIn(){
 const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
 document.getElementById("msg").textContent="Signing in…";
 const {error}=await sb.auth.signInWithPassword({email,password});
 if(error){document.getElementById("msg").textContent=error.message;return}
 await load();
}
logout.onclick=async()=>{await sb.auth.signOut();candidate=null;voters=[];loginView()};
async function load(){
 const {data:{user}}=await sb.auth.getUser();
 if(!user){loginView();return}
 const {data:c,error:ce}=await sb.from("candidates").select("*").eq("owner_user_id",user.id).maybeSingle();
 if(ce||!c){loginView("इस login से कोई candidate account linked नहीं है।");await sb.auth.signOut();return}
 if(!c.active){loginView("Candidate account अभी active नहीं है। Admin से संपर्क करें।");await sb.auth.signOut();return}
 if(c.subscription_expiry && new Date(c.subscription_expiry+"T23:59:59") < new Date()){loginView("Candidate subscription expire हो चुका है। Admin से संपर्क करें।");await sb.auth.signOut();return}
 candidate={...c};
 for(const [col,key] of [["photo_path","photo_url"],["symbol_path","symbol_url"],["banner_path","banner_url"]]){
   if(c[col]){const {data:signed}=await sb.storage.from("candidate-branding").createSignedUrl(c[col],3600);candidate[key]=signed?.signedUrl||""}
 }
 const {data:v,error:ve}=await sb.from("voters").select("*").eq("candidate_id",c.id).order("id",{ascending:true}).limit(10000);
 if(ve){loginView("Voter data load error: "+ve.message);return}
 voters=v||[];logout.classList.remove("hidden");dashboard();
}
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\u0900-\u097f]+/g,"");
const sk=s=>norm(s).replace(/chh/g,"ch").replace(/sh/g,"s").replace(/ph/g,"f").replace(/bh/g,"b").replace(/dh/g,"d").replace(/th/g,"t").replace(/kh/g,"k").replace(/gh/g,"g").replace(/jh/g,"j").replace(/w/g,"v").replace(/[aeiouy]/g,"");
function smart(a){return [...new Set(a.filter(x=>x!==null&&x!==undefined&&String(x)!==""))].sort((a,b)=>{const an=Number(a),bn=Number(b);return !isNaN(an)&&!isNaN(bn)?an-bn:String(a).localeCompare(String(b),"hi")})}
function uniq(k,base=voters){return smart(base.map(x=>x[k]))}
function options(k,label,base=voters){return `<option value="">${label}</option>`+uniq(k,base).map(x=>`<option value="${e(x)}">${e(x)}</option>`).join("")}
function dashboard(){
 const c=candidate;
 app.innerHTML=`<div class="card hero">${c.photo_url?`<img src="${e(c.photo_url)}" alt="Candidate photo">`:`<div style="width:82px;height:82px;border-radius:50%;border:3px solid #fff;display:grid;place-items:center;font-size:28px;font-weight:900">${e((c.hindi_name||c.name||"P").slice(0,1))}</div>`}<div><div class="muted">PANCHAYAT DIGITAL</div><h2 style="margin:3px 0">${e(c.hindi_name||c.name)}</h2><div>${e(c.post||"")} • ग्राम पंचायत ${e(c.gram_panchayat||"")}</div><div class="muted">${e(c.panchayat_samiti||"")} • ${e(c.district||"")}</div>${c.symbol_url?`<img src="${e(c.symbol_url)}" alt="Election symbol" style="width:42px;height:42px;border-radius:9px;margin-top:7px;background:#fff;padding:3px">`:""}</div></div>
 ${c.banner_url?`<img src="${e(c.banner_url)}" alt="Candidate banner" style="width:100%;max-height:220px;object-fit:cover;border-radius:14px;margin-top:12px">`:""}
 <div class="card" style="margin-top:14px"><b>🔍 मतदाता खोजें / Search Voter</b><div class="filters"><input id="q" placeholder="नाम / Name / Voter ID / रिश्तेदार"><select id="ward">${options("ward","सभी वार्ड")}</select><select id="colony" disabled><option value="">पहले वार्ड चुनें</option></select><select id="house" disabled><option value="">पहले कॉलोनी चुनें</option></select><select id="booth" style="display:none"><option value="">सभी मतदान केंद्र</option></select><button class="btn ghost" onclick="clearFilters()">Reset Filters</button></div></div>
 <div class="grid" style="margin-top:14px"><div class="card stat"><strong id="total">0</strong><span>Voters</span></div><div class="card stat"><strong id="male">0</strong><span>Male</span></div><div class="card stat"><strong id="female">0</strong><span>Female</span></div><div class="card stat"><strong id="houses">0</strong><span>Houses</span></div></div>
 <div id="familyBox" class="card family"></div><div id="result" style="margin-top:12px"></div>
 <dialog id="detailDlg"><h3>मतदाता विवरण</h3><div id="detailBody"></div><div style="margin-top:12px"><button class="btn ghost" onclick="detailDlg.close()">Close</button></div></dialog>`;
 document.getElementById("q").addEventListener("input",()=>{page=1;renderRows()});
 document.getElementById("ward").addEventListener("change",()=>cascade("ward"));
 document.getElementById("colony").addEventListener("change",()=>cascade("colony"));
 document.getElementById("house").addEventListener("change",()=>{page=1;renderRows()});
 renderRows();
}
function matchQ(v,q){if(!q)return true;const nq=norm(q),sq=sk(q);const fields=[v.name,v.epic,v.relative_name,v.house_no,v.colony,v.ward,v.polling_station];if(fields.some(x=>norm(x).includes(nq)))return true;if(sq.length>=2)return fields.some(x=>sk(x).includes(sq));return false}
function filtered(ignoreQ=false){
 const q=ignoreQ?"":document.getElementById("q").value.trim(),w=document.getElementById("ward").value,co=document.getElementById("colony").value,h=document.getElementById("house").value,b=document.getElementById("booth").value;
 return voters.filter(v=>(!w||String(v.ward)===String(w))&&(!co||String(v.colony)===String(co))&&(!h||String(v.house_no)===String(h))&&(!b||String(v.polling_station)===String(b))&&matchQ(v,q));
}
function cascade(from){const w=document.getElementById("ward").value,c=document.getElementById("colony").value;if(from==="ward"){document.getElementById("colony").value="";document.getElementById("house").value=""}if(from==="colony")document.getElementById("house").value="";const bw=w?voters.filter(v=>String(v.ward)===String(w)):voters;const co=document.getElementById("colony");co.innerHTML=options("colony","सभी कॉलोनी",bw);co.disabled=!w;const cv=co.value;const bc=cv?bw.filter(v=>String(v.colony)===String(cv)):bw;const ho=document.getElementById("house");ho.innerHTML=options("house_no","सभी मकान",bc);ho.disabled=!w||!co.value;renderRows()}
function clearFilters(){document.getElementById("q").value="";document.getElementById("ward").value="";document.getElementById("colony").innerHTML="<option value=\"\">पहले वार्ड चुनें</option>";document.getElementById("house").innerHTML="<option value=\"\">पहले कॉलोनी चुनें</option>";document.getElementById("colony").disabled=true;document.getElementById("house").disabled=true;document.getElementById("booth").value="";page=1;renderRows();}
function houseCount(v){return voters.filter(x=>String(x.ward)===String(v.ward)&&String(x.colony)===String(v.colony)&&String(x.house_no)===String(v.house_no)).length}
function showDetail(v){detailBody.innerHTML=[["क्रम संख्या",v.serial_no],["Voter ID",v.epic],["नाम",v.name],["पिता/पति/अन्य",v.relative_name],["मकान",v.house_no],["कॉलोनी",v.colony],["वार्ड",v.ward],["मतदान केंद्र",v.polling_station],["आयु",v.age],["लिंग",v.gender]].map(x=>`<div class="drow"><span>${e(x[0])}</span><b>${e(x[1]??"-")}</b></div>`).join("");detailDlg.showModal()}
async function shareInfo(v){const t=`मतदाता सूचना\n${v.name||""}\nVoter ID: ${v.epic||""}\nWard: ${v.ward||""}\nHouse: ${v.house_no||""}\nFor voter-list reference only.`;if(navigator.share){try{await navigator.share({title:"Voter Information",text:t});return}catch(x){if(x.name==="AbortError")return}}try{await navigator.clipboard.writeText(t);alert("Voter information copied.")}catch(x){alert(t)}}
function familyPanel(){const b=familyBox,w=ward.value,co=colony.value,h=house.value,a=(w&&co&&h)?voters.filter(v=>String(v.ward)===String(w)&&String(v.colony)===String(co)&&String(v.house_no)===String(h)):[];if(!a.length){b.style.display="none";return}b.style.display="block";b.innerHTML=`<b>🏠 मकान ${e(h)} — ${a.length} मतदाता</b><div class="muted">${e(co)} • Ward ${e(w)}</div><div style="margin-top:8px">${a.map(v=>`<div style="padding:6px 0;border-top:1px solid #eee"><b>${e(v.name)}</b> · ${e(v.epic)}<br><small>${e(v.relative_name)} • ${e(v.age)} • ${e(v.gender)}</small></div>`).join("")}</div><button class="btn ghost" style="margin-top:8px" onclick="printHouse()">📄 House PDF / Print</button>`}
function renderRows(){
 const a=filtered(),isMale=x=>/पुरुष|male|^m$/i.test(x.gender||""),isFemale=x=>/स्त्री|महिला|female|^f$/i.test(x.gender||"");
 total.textContent=a.length;male.textContent=a.filter(isMale).length;female.textContent=a.filter(isFemale).length;houses.textContent=new Set(a.map(x=>String(x.ward)+"|"+String(x.colony)+"|"+String(x.house_no))).size;
 const pages=Math.max(1,Math.ceil(a.length/PER));page=Math.min(page,pages);const chunk=a.slice((page-1)*PER,page*PER);
 result.innerHTML=`<div class="muted" style="margin-bottom:8px">${a.length} records</div><div class="cards">${chunk.map((v,i)=>`<article class="card vcard"><div class="vtop"><div><div class="vname">${e(v.name)}</div><div class="vrel">संबंधी: ${e(v.relative_name)}</div></div><div class="vid">${e(v.epic)}</div></div><div class="meta"><span class="pill">Ward ${e(v.ward)}</span><span class="pill">${e(v.colony)}</span><span class="pill housepill">🏠 ${e(v.house_no)} · ${houseCount(v)} voters</span><span class="pill">Age ${e(v.age)}</span><span class="pill">${e(v.gender)}</span></div><div class="actions"><button class="btn ghost det" data-i="${i}">Details</button><button class="btn ghost pdfb" data-i="${i}">📄 PDF</button><button class="btn ghost shareb" data-i="${i}">↗ Share</button></div></article>`).join("")}</div><div class="pager"><button id="pPrev">← Previous</button><b>Page ${page} / ${pages}</b><button id="pNext">Next →</button></div>`;
 result.querySelectorAll(".det").forEach(x=>x.onclick=()=>showDetail(chunk[+x.dataset.i]));result.querySelectorAll(".pdfb").forEach(x=>x.onclick=()=>voterSlip(JSON.stringify(chunk[+x.dataset.i])));result.querySelectorAll(".shareb").forEach(x=>x.onclick=()=>shareInfo(chunk[+x.dataset.i]));
 pPrev.onclick=()=>{if(page>1){page--;renderRows()}};pNext.onclick=()=>{if(page<pages){page++;renderRows()}};familyPanel();
}
function prevPage(){if(page>1){page--;renderRows()}}function nextPage(){if(page<Math.ceil(filtered().length/PER)){page++;renderRows()}}
function voterSlip(j){const v=JSON.parse(j);const w=window.open("","_blank");if(!w)return;w.document.write(`<html><head><meta charset="utf-8"><title>Voter Slip</title><style>body{font-family:"Nirmala UI",Arial;padding:25px}.s{max-width:650px;margin:auto;border:2px solid #222;padding:20px}.s h2{text-align:center}.r{display:grid;grid-template-columns:180px 1fr;border-top:1px solid #ddd;padding:8px}</style></head><body><div class="s"><h2>${e(candidate.gram_panchayat)} — मतदाता पर्ची</h2>${[["क्रम संख्या",v.serial_no],["Voter ID",v.epic],["नाम",v.name],["पिता/पति/अन्य",v.relative_name],["मकान",v.house_no],["कॉलोनी",v.colony],["वार्ड",v.ward],["मतदान केंद्र",v.polling_station],["आयु",v.age],["लिंग",v.gender]].map(x=>`<div class="r"><b>${e(x[0])}</b><span>${e(x[1]||"-")}</span></div>`).join("")}</div><script>setTimeout(()=>print(),250)<\/script></body></html>`);w.document.close()}
function printHouse(){
 const a=filtered(); if(!a.length){alert("कोई voter नहीं मिला।");return}
 const old=document.title;document.title=`${candidate.gram_panchayat||"Panchayat"}_Voter_List`;window.print();document.title=old;
}
sb.auth.onAuthStateChange(()=>{});
load();
</script></body></html>
