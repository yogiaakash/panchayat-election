<style>

header{background:linear-gradient(135deg,var(--p2),var(--p));color:#fff;border-bottom:0;padding:15px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;box-shadow:0 3px 14px #0b3b3028}

input,select,button{font:inherit}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff}label{display:block;margin:12px 0 5px;font-weight:700}.btn{border:0;border-radius:10px;padding:11px 15px;cursor:pointer}.primary{background:var(--p);color:#fff;font-weight:800}.ghost{background:var(--mint);color:var(--p2);font-weight:800}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;gap:9px;margin:14px 0}

</style><style>.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.tabbtn{padding:12px 8px;border:1px solid var(--line);background:#fff;border-radius:12px;font-weight:900;color:var(--p2);cursor:pointer}.tabbtn.active{background:var(--p);color:#fff}.tabpane{display:none}.tabpane.active{display:block}.aztable{width:100%;border-collapse:collapse}.aztable th,.aztable td{padding:8px;border-bottom:1px solid var(--line);font-size:13px}.aztools{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;margin:10px 0}@media(max-width:649px){.tabs{grid-template-columns:1fr}.aztools{grid-template-columns:1fr}}</style><style>

<main id="app"></main>
<script>
const SUPABASE_URL="https://ieoltipygxawhsvlxnsj.supabase.co", SUPABASE_PUBLISHABLE_KEY="sb_publishable_AzM0AxHgmX2a6-9On5jgNg_7SuasTXH";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const app=document.getElementById("app"), logout=document.getElementById("logout");
let candidate=null,voters=[],page=1; const PER=40;

const DEV_TO_LAT={"क":"k","ख":"kh","ग":"g","घ":"gh","च":"ch","छ":"chh","ज":"j","झ":"jh","ट":"t","ठ":"th","ड":"d","ढ":"dh","त":"t","थ":"th","द":"d","ध":"dh","न":"n","प":"p","फ":"ph","ब":"b","भ":"bh","म":"m","य":"y","र":"r","ल":"l","व":"v","श":"sh","ष":"sh","स":"s","ह":"h","ा":"a","ि":"i","ी":"i","ु":"u","ू":"u","े":"e","ै":"ai","ो":"o","ौ":"au","ं":"n","ँ":"n","ः":"h","्":""};
function latinize(v){return String(v??"").split("").map(ch=>DEV_TO_LAT[ch]??ch).join("").toLowerCase().replace(/[^a-z0-9]+/g," ").trim()}
const e=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function loginView(msg=""){
 logout.classList.add("hidden");
 app.innerHTML=`<div class="card login"><h2>Candidate Login</h2><p class="muted">अपने अधिकृत Email और Password से लॉगिन करें।</p>
 <label>Email</label><input id="email" type="email" autocomplete="username">
 <label>Password</label><input id="password" type="password" autocomplete="current-password">
 <button class="btn primary" style="width:100%;margin-top:16px" onclick="signIn()">Login</button>
 <p id="msg" class="error">${e(msg)}</p></div>`;
}
async function signIn(){
 const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
 document.getElementById("msg").textContent="Signing in…";
 const {error}=await sb.auth.signInWithPassword({email,password});
 if(error){document.getElementById("msg").textContent=error.message;return}
 await load();
}
logout.onclick=async()=>{await sb.auth.signOut();candidate=null;voters=[];loginView()};
async function load(){
 const {data:{user}}=await sb.auth.getUser();
 if(!user){loginView();return}
 const {data:c,error:ce}=await sb.from("candidates").select("*").eq("owner_user_id",user.id).maybeSingle();
 if(ce||!c){loginView("इस login से कोई candidate account linked नहीं है।");await sb.auth.signOut();return}
 if(!c.active){loginView("Candidate account अभी active नहीं है। Admin से संपर्क करें।");await sb.auth.signOut();return}
 if(c.subscription_expiry && new Date(c.subscription_expiry+"T23:59:59") < new Date()){loginView("Candidate subscription expire हो चुका है। Admin से संपर्क करें।");await sb.auth.signOut();return}
 candidate={...c};
 for(const [col,key] of [["photo_path","photo_url"],["symbol_path","symbol_url"],["banner_path","banner_url"]]){
   candidate[key]="";
   if(c[col]){
     const {data:signed,error:signErr}=await sb.storage.from("candidate-branding").createSignedUrl(c[col],86400);
     if(!signErr && signed?.signedUrl) candidate[key]=signed.signedUrl;
   }
 }
 let allVoters=[];
 for(let from=0;;from+=1000){
   const {data:batch,error:ve}=await sb.from("voters").select("*").eq("candidate_id",c.id).order("id",{ascending:true}).range(from,from+999);
   if(ve){loginView("Voter data load error: "+ve.message);return}
   allVoters.push(...(batch||[]));
   if(!batch||batch.length<1000)break;
 }
 voters=allVoters;logout.classList.remove("hidden");dashboard();
}
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\u0900-\u097f]+/g,"");
const sk=s=>norm(s).replace(/chh/g,"ch").replace(/sh/g,"s").replace(/ph/g,"f").replace(/bh/g,"b").replace(/dh/g,"d").replace(/th/g,"t").replace(/kh/g,"k").replace(/gh/g,"g").replace(/jh/g,"j").replace(/w/g,"v").replace(/[aeiouy]/g,"");
function smart(a){return [...new Set(a.filter(x=>x!==null&&x!==undefined&&String(x)!==""))].sort((a,b)=>{const an=Number(a),bn=Number(b);return !isNaN(an)&&!isNaN(bn)?an-bn:String(a).localeCompare(String(b),"hi")})}
function uniq(k,base=voters){return smart(base.map(x=>x[k]))}
function options(k,label,base=voters){return `<option value="">${label}</option>`+uniq(k,base).map(x=>`<option value="${e(x)}">${e(x)}</option>`).join("")}
function dashboard(){
 const c=candidate;
 app.innerHTML=`<div class="card hero">${c.photo_url?`<img src="${e(c.photo_url)}" alt="Candidate photo" referrerpolicy="no-referrer" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><div style="display:none;width:82px;height:82px;border-radius:50%;border:3px solid #fff;place-items:center;font-size:28px;font-weight:900">${e((c.hindi_name||c.name||"P").slice(0,1))}</div>`:`<div style="width:82px;height:82px;border-radius:50%;border:3px solid #fff;display:grid;place-items:center;font-size:28px;font-weight:900">${e((c.hindi_name||c.name||"P").slice(0,1))}</div>`}<div><div class="muted">PANCHAYAT DIGITAL</div><h2 style="margin:3px 0">${e(c.hindi_name||c.name)}</h2><div>${e(c.post||"")} • ग्राम पंचायत ${e(c.gram_panchayat||"")}</div><div class="muted">${e(c.panchayat_samiti||"")} • ${e(c.district||"")}</div></div></div>
 <div class="quicknav"><button class="quick" onclick="showTab('info')"><span class="ico">👥</span>मतदाता जानकारी</button><button class="quick" onclick="showTab('slip')"><span class="ico">📄</span>मतदाता पर्ची</button><button class="quick" onclick="showTab('stats')"><span class="ico">A↕Z</span>सांख्यिकी + A–Z</button></div>
 <div class="tabs"><button id="tbInfo" class="tabbtn active" onclick="showTab('info')">1. मतदाता जानकारी</button><button id="tbSlip" class="tabbtn" onclick="showTab('slip')">2. मतदाता पर्ची</button><button id="tbStats" class="tabbtn" onclick="showTab('stats')">3. सांख्यिकी + A–Z</button></div>
 <section id="tabSlip" class="tabpane"><div class="card"><h3>📄 Voter Slip Download</h3><p class="muted">Ward चुनकर 9 slips per A4 page PDF बनाएं।</p><select id="slipWard">${options("ward","वार्ड चुनें")}</select><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn primary" onclick="downloadWardPdf()">📄 Ward-wise PDF</button><button class="btn ghost" onclick="shareWardPdf()">↗ Share Ward PDF</button></div></div></section>
 <section id="tabInfo" class="tabpane active"><div class="card"><b>🔍 मतदाता खोजें / Search Voter</b><div class="filters"><input id="q" placeholder="नाम / Name / Voter ID / रिश्तेदार"><select id="ward">${options("ward","सभी वार्ड")}</select><select id="colony" disabled><option value="">पहले वार्ड चुनें</option></select><select id="house" disabled><option value="">पहले कॉलोनी चुनें</option></select><select id="booth" style="display:none"><option value="">सभी मतदान केंद्र</option></select><button class="btn ghost" onclick="clearFilters()">Reset Filters</button></div></div><div id="familyBox" class="card family"></div><div id="result" style="margin-top:12px"></div></section>
 <section id="tabStats" class="tabpane"><div style="display:none"><strong id="total">0</strong><strong id="male">0</strong><strong id="female">0</strong><strong id="wards">0</strong><strong id="colonies">0</strong><strong id="houses">0</strong></div><div class="card"><h3>🔤 Alphabetical Voter List</h3><div class="aztools"><select id="azWard" onchange="renderAZ()"><option value="">पूरी पंचायत — Combined</option>${[...new Set(voters.map(v=>String(v.ward||"")))].filter(Boolean).sort().map(w=>`<option value="${e(w)}">Ward ${e(w)}</option>`).join("")}</select><button class="btn ghost" onclick="printAZ()">🖨 Print / PDF</button><button class="btn ghost" onclick="downloadAZCsv()">⬇ Excel/CSV</button></div><div id="azResult"></div></div></section>
 <dialog id="detailDlg"><h3>मतदाता विवरण</h3><div id="detailBody"></div><div style="margin-top:12px"><button class="btn ghost" onclick="detailDlg.close()">Close</button></div></dialog>`;
 q.addEventListener("input",()=>{page=1;renderRows()});ward.addEventListener("change",()=>cascade("ward"));colony.addEventListener("change",()=>cascade("colony"));house.addEventListener("change",()=>{page=1;renderRows()});renderRows();renderAZ();
}
function showTab(k){["slip","info","stats"].forEach(x=>{document.getElementById("tab"+x[0].toUpperCase()+x.slice(1)).classList.toggle("active",x===k);document.getElementById("tb"+x[0].toUpperCase()+x.slice(1)).classList.toggle("active",x===k)});if(k==="stats")renderAZ()}
function azData(){const w=document.getElementById("azWard")?.value||"";return voters.filter(v=>!w||String(v.ward)===w).slice().sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""),"hi"))}
function renderAZ(){const a=azData(),box=document.getElementById("azResult");if(!box)return;box.innerHTML=`<div class="muted" style="margin:8px 0">${a.length} voters</div><div class="tablewrap"><table class="aztable"><thead><tr><th>क्रम</th><th>नाम</th><th>पिता/पति</th><th>EPIC</th><th>Ward</th><th>House</th></tr></thead><tbody>${a.map(v=>`<tr><td>${e(v.serial_no)}</td><td><b>${e(v.name)}</b></td><td>${e(v.relative_name)}</td><td>${e(v.epic)}</td><td>${e(v.ward)}</td><td>${e(v.house_no)}</td></tr>`).join("")}</tbody></table></div>`}
function printAZ(){const a=azData(),w=open("","_blank");if(!w)return;w.document.write(`<!doctype html><html lang="hi"><head><meta charset="utf-8"><title>A-Z Voter List</title><style>body{font-family:"Nirmala UI",Arial;padding:16px}h2{text-align:center}table{width:100%;border-collapse:collapse;font-size:11px}th,td{border:1px solid #aaa;padding:5px;text-align:left}@page{size:A4;margin:10mm}</style></head><body><h2>ग्राम पंचायत ${e(candidate.gram_panchayat||"")} — A–Z मतदाता सूची</h2><table><tr><th>क्रम</th><th>नाम</th><th>पिता/पति</th><th>EPIC</th><th>Ward</th><th>House</th></tr>${a.map(v=>`<tr><td>${e(v.serial_no)}</td><td>${e(v.name)}</td><td>${e(v.relative_name)}</td><td>${e(v.epic)}</td><td>${e(v.ward)}</td><td>${e(v.house_no)}</td></tr>`).join("")}</table></body></html>`);w.document.close();setTimeout(()=>w.print(),300)}
function downloadAZCsv(){const a=azData(),rows=[["Serial","Name","Relative","EPIC","Ward","House"],...a.map(v=>[v.serial_no,v.name,v.relative_name,v.epic,v.ward,v.house_no])],csv="\uFEFF"+rows.map(r=>r.map(x=>'"'+String(x??"").replace(/"/g,'""')+'"').join(",")).join("\n"),b=new Blob([csv],{type:"text/csv;charset=utf-8"}),u=URL.createObjectURL(b),ln=document.createElement("a");ln.href=u;ln.download=(azWard.value?`Ward_${azWard.value}`:"Panchayat_Combined")+"_AZ_List.csv";ln.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}

const DV={"अ":"a","आ":"aa","इ":"i","ई":"ee","उ":"u","ऊ":"oo","ए":"e","ऐ":"ai","ओ":"o","औ":"au","ऋ":"ri"},DC={"क":"k","ख":"kh","ग":"g","घ":"gh","ङ":"ng","च":"ch","छ":"chh","ज":"j","झ":"jh","ञ":"ny","ट":"t","ठ":"th","ड":"d","ढ":"dh","ण":"n","त":"t","थ":"th","द":"d","ध":"dh","न":"n","प":"p","फ":"ph","ब":"b","भ":"bh","म":"m","य":"y","र":"r","ल":"l","व":"v","श":"sh","ष":"sh","स":"s","ह":"h","ळ":"l"},DM={"ा":"aa","ि":"i","ी":"ee","ु":"u","ू":"oo","ृ":"ri","े":"e","ै":"ai","ो":"o","ौ":"au","ं":"n","ँ":"n","ः":"h","्":""};
function roman(s){s=String(s||"");let o="";for(let i=0;i<s.length;i++){let ch=s[i];if(DV[ch]){o+=DV[ch];continue}if(DC[ch]){let nx=s[i+1];o+=DC[ch];if(DM[nx]!==undefined){o+=DM[nx];i++}else o+="a";continue}if(DM[ch]!==undefined){o+=DM[ch];continue}o+=ch}return norm(o).replace(/aa/g,"a").replace(/ee/g,"i").replace(/oo/g,"u").replace(/ph/g,"f").replace(/sh/g,"s").replace(/v/g,"w")}
function matchQ(v,q){if(!q)return true;const nq=norm(q),rq=roman(q),fields=[v.name,v.epic,v.relative_name,v.house_no,v.colony,v.ward,v.polling_station];return fields.some(x=>norm(x).includes(nq)||roman(x).includes(nq)||roman(x).includes(rq))}
function filtered(ignoreQ=false){
 const q=ignoreQ?"":document.getElementById("q").value.trim(),w=document.getElementById("ward").value,co=document.getElementById("colony").value,h=document.getElementById("house").value,b=document.getElementById("booth").value;
 return voters.filter(v=>(!w||String(v.ward)===String(w))&&(!co||String(v.colony)===String(co))&&(!h||String(v.house_no)===String(h))&&(!b||String(v.polling_station)===String(b))&&matchQ(v,q));
}
function cascade(from){
 const w=document.getElementById("ward").value,co=document.getElementById("colony"),ho=document.getElementById("house");
 if(from==="ward"){
  co.innerHTML=options("colony","सभी कॉलोनी",w?voters.filter(v=>String(v.ward)===String(w)):[]);
  co.disabled=!w;ho.innerHTML='<option value="">पहले कॉलोनी चुनें</option>';ho.disabled=true;
 }else{
  const cv=co.value,base=(w&&cv)?voters.filter(v=>String(v.ward)===String(w)&&String(v.colony)===String(cv)):[];
  ho.innerHTML=options("house_no","सभी मकान",base);ho.disabled=!(w&&cv);
 }
 page=1;renderRows();
}
function clearFilters(){document.getElementById("q").value="";document.getElementById("ward").value="";document.getElementById("colony").innerHTML="<option value=\"\">पहले वार्ड चुनें</option>";document.getElementById("house").innerHTML="<option value=\"\">पहले कॉलोनी चुनें</option>";document.getElementById("colony").disabled=true;document.getElementById("house").disabled=true;document.getElementById("booth").value="";page=1;renderRows();}
function houseCount(v){return voters.filter(x=>String(x.ward)===String(v.ward)&&String(x.colony)===String(v.colony)&&String(x.house_no)===String(v.house_no)).length}
function showDetail(v){detailBody.innerHTML=[["क्रम संख्या",v.serial_no],["Voter ID",v.epic],["नाम",v.name],["पिता/पति/अन्य",v.relative_name],["मकान",v.house_no],["कॉलोनी",v.colony],["वार्ड",v.ward],["मतदान केंद्र",v.polling_station],["आयु",v.age],["लिंग",v.gender]].map(x=>`<div class="drow"><span>${e(x[0])}</span><b>${e(x[1]??"-")}</b></div>`).join("");detailDlg.showModal()}

async function sharePdfFile(file,title,text){if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){try{await navigator.share({title,text,files:[file]});return}catch(x){if(x.name==="AbortError")return}}const u=URL.createObjectURL(file),a=document.createElement("a");a.href=u;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);alert("PDF तैयार है। WhatsApp में attachment के रूप में share करें।")}
