async function hindiPlaceName(name){

   "ARAIN PANCHAYAT SAMITI":"अरांई पंचायत समिति",

   "BADLYA PANCHAYAT SAMITI":"बाडल्या पंचायत समिति",
   "BHINAY PANCHAYAT SAMITI":"भिनाय पंचायत समिति",
   "KEKRI PANCHAYAT SAMITI":"केकड़ी पंचायत समिति",
   "KISHANGARH (SILORA) PANCHAYAT SAMITI":"किशनगढ़ (सिलोरा) पंचायत समिति",

   "SRINAGAR PANCHAYAT SAMITI":"श्रीनगर पंचायत समिति"
 };
 const key=raw.replace(/\\s+/g," ").toUpperCase();
 if(fixed[key])return fixed[key];

 // Generic Panchayat Samiti handling: translate only the place name.
 const psMatch=raw.match(/^(.*?)\\s+PAN(?:CHAYAT)?\\s+SAMITI$/i);
 if(psMatch){
   const base=psMatch[1].trim();
   const translated=await hindiPlaceName(base);
   return translated+" पंचायत समिति";
 }

 const exact={
   "AREIN":"अरांई",
   "ARAIN":"अरांई",
   "RURAL":"ग्रामीण",
   "AJMER RURAL":"अजमेर ग्रामीण"
 };
 const exactKey=key;
 if(exact[exactKey])return exact[exactKey];

 if(hiPlaceCache.has(raw))return hiPlaceCache.get(raw);
 try{
   const res=await fetch("https://inputtools.google.com/request?text="+encodeURIComponent(raw)+"&itc=hi-t-i0-und&num=5&cp=0&cs=1&ie=utf-8&oe=utf-8");

 }

async function compressSignupPhoto(file){
 return new Promise((resolve,reject)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{
   URL.revokeObjectURL(url);
   const max=700,scale=Math.min(1,max/Math.max(img.width,img.height));
   const cv=document.createElement("canvas");cv.width=Math.max(1,Math.round(img.width*scale));cv.height=Math.max(1,Math.round(img.height*scale));
   const ctx=cv.getContext("2d");ctx.drawImage(img,0,0,cv.width,cv.height);
   let q=.72;
   const make=()=>{const out=cv.toDataURL("image/jpeg",q);if(out.length>650000&&q>.35){q-=.08;setTimeout(make,0)}else resolve(out)};
   make();
  };
  img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("Photo process नहीं हो सकी"))};
  img.src=url;
 });
}

async function ensureRecoverySession(){
 let {data:{session}}=await sb.auth.getSession();
 if(session?.access_token)return session;

 const params=new URLSearchParams(location.search);
 const code=params.get("code");
 if(code){
   const exchanged=await sb.auth.exchangeCodeForSession(code);
   if(exchanged?.error)throw exchanged.error;
   session=exchanged?.data?.session||null;
   if(session?.access_token){
     recoverySessionBackup={access_token:session.access_token,refresh_token:session.refresh_token};
     return session;
   }
 }

 const hp=new URLSearchParams((location.hash||"").replace(/^#/,""));
 const access=hp.get("access_token"),refresh=hp.get("refresh_token");
 if(access&&refresh){
   const restored=await sb.auth.setSession({access_token:access,refresh_token:refresh});
   if(restored?.error)throw restored.error;
   session=restored?.data?.session||null;
   if(session?.access_token){
     recoverySessionBackup={access_token:session.access_token,refresh_token:session.refresh_token};
     return session;
   }
 }

 if(recoverySessionBackup?.access_token&&recoverySessionBackup?.refresh_token){
   const restored=await sb.auth.setSession(recoverySessionBackup);
   if(!restored?.error&&restored?.data?.session)return restored.data.session;
 }

 return null;
}
async function updateRecoveryPassword(){

 if(p.length<8){msg.textContent="Password कम से कम 8 characters का होना चाहिए।";return}
 if(p!==p2){msg.textContent="दोनों passwords समान नहीं हैं।";return}
 msg.textContent="Password update हो रहा है…";
 try{
   const session=await ensureRecoverySession();
   if(!session){
     msg.textContent="Reset session expire हो गया है। कृपया नया password reset link भेजें।";
     return;
   }
   const {error}=await sb.auth.updateUser({password:p});
   if(error){msg.textContent=error.message;return}
   await sb.auth.signOut();
   recoverySessionBackup=null;
   history.replaceState({},document.title,"/login/");
   currentUser=null;currentAccess=null;candidate=null;voters=[];
   loginView("Password successfully update हो गया। अब नए password से Login करें।");
 }catch(err){

 }
}

 // Candidate profile/photo is refreshed after the voter dashboard renders.
 // Do not block the login screen on this optional query.

 // Always display the candidate's name in Hindi in the dashboard header.
 // Older accounts may have only the English name saved, so transliterate it
 // automatically instead of falling back to English.
 if(candidate.name && !/[\\u0900-\\u097F]/.test(candidate.hindi_name||"")){
   try{
     candidate.hindi_name=await transliterateHindiText(candidate.name);
   }catch(_){
     candidate.hindi_name=candidate.name;
   }
 }

 // Prepare dashboard state; render only after voter data has finished loading.
 voters=[];
 masterVoterCount=0;
 contactMap=new Map();
 additionRows=[];
 houseOverrideMap=new Map();
 voterMobileMap=new Map();

 (async()=>{
   // Refresh this signed-in user's access before applying any client-side masking.
   // Full access is granted only by the server-backed panchayat_access row.
   try{
     const {data:accessRow,error:accessError}=await sb.from("panchayat_access")
       .select("panchayat_id,access_level,status,expires_at")
       .eq("user_id",user.id)
       .eq("panchayat_id",currentAccess.panchayat_id)
       .eq("status","active")
       .order("created_at",{ascending:false})
       .limit(1).maybeSingle();
     if(accessError) throw accessError;
     if(accessRow){
       const level=String(accessRow.access_level||"free").trim().toLowerCase();
       const expired=accessRow.expires_at && new Date(accessRow.expires_at)<=new Date();
       currentAccess={...currentAccess,...accessRow,access_level:(!expired&&["paid","lifetime","admin"].includes(level))?"full":"free"};
     }
   }catch(accessErr){
     console.warn("Access refresh failed; keeping free access for safety:",accessErr);
   }

   // Load voter data after access has been verified.
   try{
     const all=[];
     const pageSize=500;
     let expectedCount=0;
     for(let offset=0;;offset+=pageSize){
       let {data:{session}}=await sb.auth.getSession();
       if(!session?.access_token){
         const refreshed=await sb.auth.refreshSession();
         session=refreshed?.data?.session||null;
       }
       if(!session?.access_token) throw new Error("Login session token missing");
       let invokeResult=await sb.functions.invoke("candidate-voter-data",{body:{offset,limit:pageSize,access_token:session.access_token,panchayat_id:selectedGlobalPanchayatId||undefined}});
       let payload=invokeResult.data;
       let pageError=invokeResult.error;
       const authFailed=pageError && (pageError?.context?.status===401 || /401|unauthorized|invalid session/i.test(String(pageError?.message||"")));
       if(authFailed){
         console.warn("Voter request session expired. Refreshing login session and retrying once…");
         const refreshed=await sb.auth.refreshSession();
         const freshSession=refreshed?.data?.session;
         if(!freshSession?.access_token) throw pageError;
         invokeResult=await sb.functions.invoke("candidate-voter-data",{body:{offset,limit:pageSize,access_token:freshSession.access_token,panchayat_id:selectedGlobalPanchayatId||undefined}});
         payload=invokeResult.data;
         pageError=invokeResult.error;
       }
       if(pageError) throw pageError;
       if(payload?.error) throw new Error(payload.error);
       const rows=Array.isArray(payload?.voters)?payload.voters:[];
       all.push(...rows);
       expectedCount=Number(payload?.master_count||expectedCount||0);
       if(payload?.panchayat_id) currentAccess.panchayat_id=payload.panchayat_id;
       if(payload?.global_panchayat_access===true){
         globalPanchayatAccess=true;
         if(Array.isArray(payload?.panchayat_options)) globalPanchayatOptions=payload.panchayat_options;
         selectedGlobalPanchayatId=String(payload?.panchayat_id||selectedGlobalPanchayatId||"");
         try{if(selectedGlobalPanchayatId)localStorage.setItem("px_global_panchayat_"+user.id,selectedGlobalPanchayatId)}catch(_){}
         const selected=payload?.selected_panchayat||globalPanchayatOptions.find(x=>String(x.id)===selectedGlobalPanchayatId);
         if(selected){
           candidate.gram_panchayat=selected.gram_panchayat||candidate.gram_panchayat;
           candidate.panchayat_samiti=selected.panchayat_samiti||candidate.panchayat_samiti;
           candidate.district=selected.district||candidate.district;
         }
       }
       if(payload?.ward_no) candidate.ward_no=payload.ward_no;
       if(Array.isArray(payload?.panchayat_ids)) candidate.panchayat_ids=payload.panchayat_ids;
       if(Array.isArray(payload?.gram_panchayats)) candidate.gram_panchayats=payload.gram_panchayats;
       if(payload?.election_post) candidate.post=payload.election_post;
       if(typeof payload?.full_access==="boolean") currentAccess.access_level=payload.full_access?"full":"masked";
       console.log("Candidate voter page:",offset,"+",rows.length,"of",expectedCount);
       if(rows.length<pageSize||(expectedCount>0&&all.length>=expectedCount)) break;
       if(offset>100000) throw new Error("Unexpected voter pagination limit");
     }
     // Defense-in-depth: even if an older/deployed Edge Function returns unmasked
     // rows, a FREE candidate's browser view must still remain masked.
     const maskClientName=(value)=>{
       const s=String(value??"").trim();
       if(!s)return s;
       if(s.length<=2)return s[0]+"**";
       if(s.length===3)return s[0]+"**";
       return s.slice(0,2)+"**"+s.slice(-1);
     };
     const maskClientRelative=(value)=>{
       const s=String(value??"").trim();
       if(!s)return s;
       if(s.length<=2)return s[0]+"***";
       if(s.length===3)return s[0]+"***";
       return s.slice(0,2)+"***"+s.slice(-1);
     };
     const maskClientEpic=(value)=>{
       const s=String(value??"").trim();
       if(!s)return s;
       const slash=s.lastIndexOf("/");
       if(slash>=0 && s.length-slash>3){
         const tail=s.slice(slash+1);
         return s.slice(0,slash+1)+tail.slice(0,1)+"*****"+tail.slice(-2);
       }
       return s.length>5?s.slice(0,3)+"*****"+s.slice(-2):"*****";
     };
     const maskClientMobile=(value)=>{
       const s=String(value??"").trim();
       if(!s)return s;
       return s.length>4?s.slice(0,2)+"******"+s.slice(-2):"********";
     };
     voters=currentAccess.access_level==="full" ? all : all.map(v=>({
       ...v,
       name:maskClientName(v.name),
       relative_name:maskClientRelative(v.relative_name),
       epic:maskClientEpic(v.epic),
       mobile_number:v.mobile_number?maskClientMobile(v.mobile_number):v.mobile_number
     }));
     masterVoterCount=expectedCount||all.length;
     console.log("Candidate voter data:",voters.length,currentAccess.access_level.toUpperCase(),"ACCESS");
     if(!voters.length) throw new Error("Database returned 0 voters");
   }catch(e){
     console.error("Voter data refresh failed:",e);
     loginView("Voter data load failed: "+(e?.message||String(e)));
     return;
   }

   // Load persistent voter mobile numbers BEFORE rendering the dashboard.
   // This guarantees logout/login and another browser restore the same data.
   try{
     const scopePids=(Array.isArray(candidate.panchayat_ids)&&candidate.panchayat_ids.length)?candidate.panchayat_ids:[currentAccess.panchayat_id];
     const {data:mobileRows,error:mobileError}=await sb.from("voter_mobile_numbers")
       .select("id,user_id,panchayat_id,voter_id,mobile_number,created_at,updated_at")
       .eq("user_id",user.id)
       .in("panchayat_id",scopePids);
     if(mobileError) throw mobileError;
     voterMobileMap=new Map((mobileRows||[]).map(x=>[String(x.voter_id),x]));
     console.log("Persistent voter mobiles loaded:",voterMobileMap.size);
   }catch(mobileError){
     console.error("Persistent voter mobile load failed:",mobileError);
     voterMobileMap=new Map();
   }

   // Prepare Hindi candidate / Panchayat header before the first dashboard render.
   await prepareCandidateHindiHeader();

   if(isPanchayatSamitiMemberLogin()){
     psAllVoters=[...voters];
     psAllMobileRows=[...voterMobileMap.values()];
     voters=[];
     voterMobileMap=new Map();
     masterVoterCount=0;
     selectedPSPanchayatId="";
   }else{
     psAllVoters=[];psAllMobileRows=[];selectedPSPanchayatId="";
   }

   // Render only after persistent mobile numbers and Hindi header fields are ready.
   dashboard();

   // Optional metadata can load after the dashboard is visible.
   const metadataScopePids=(Array.isArray(candidate.panchayat_ids)&&candidate.panchayat_ids.length)?candidate.panchayat_ids:[currentAccess.panchayat_id];
   Promise.all([
     sb.from("panchayats").select("*").eq("id",currentAccess.panchayat_id).maybeSingle(),
     sb.from("candidate_profiles").select("*").eq("user_id",user.id).maybeSingle(),
     sb.from("voter_contact_status").select("*").in("panchayat_id",metadataScopePids),
     sb.from("voter_addition_requests").select("*").in("panchayat_id",metadataScopePids).order("created_at",{ascending:false}),
     sb.from("candidate_share_settings").select("family_share_message").eq("user_id",user.id).eq("panchayat_id",currentAccess.panchayat_id).maybeSingle(),
     sb.from("voter_house_overrides").select("*").in("panchayat_id",metadataScopePids).eq("user_id",user.id),
     sb.from("voter_mobile_numbers").select("*").in("panchayat_id",metadataScopePids).eq("user_id",user.id)
   ]).then(async ([pr,prof,cs,ar,share,ho,vm])=>{
     const p=pr?.data;
     if(p){
       candidate.gram_panchayat=p.gram_panchayat||candidate.gram_panchayat;
       candidate.panchayat_samiti=p.panchayat_samiti||candidate.panchayat_samiti;
       candidate.district=p.district||candidate.district;
     }
     const localShareKey="family_share_message_"+user.id+"_"+currentAccess.panchayat_id;
     if(share?.data?.family_share_message && !String(share.data.family_share_message).trim().startsWith("<")) {
       familyShareMessage=share.data.family_share_message;
       try{localStorage.setItem(localShareKey,familyShareMessage)}catch(_){}
     }else{
       try{
         const cached=localStorage.getItem(localShareKey);
         if(cached) familyShareMessage=cached;
       }catch(_){}
     }
     const profile=prof?.data;
     if(profile){
       const previousPhoto=candidate.photo_url||meta.photo_url||"";
       candidate={...candidate,...profile};
       candidate.name=profile.candidate_name||profile.name||candidate.name;
       candidate.hindi_name=profile.candidate_name_hindi||profile.hindi_name||candidate.hindi_name||"";
       candidate.photo_url=(profile.photo_url&&String(profile.photo_url).trim())?profile.photo_url:previousPhoto;
       candidate.mobile=profile.mobile||candidate.mobile||"";
       candidate.whatsapp=profile.whatsapp||candidate.whatsapp||"";
       if(!/[\\u0900-\\u097F]/.test(candidate.hindi_name||"") && candidate.name){
         try{candidate.hindi_name=await transliterateHindiText(candidate.name)}catch(_){candidate.hindi_name=candidate.name}
       }
       candidate.post=profile.election_post||profile.post||candidate.post;
       candidate.ward_no=profile.ward_no||candidate.ward_no||"";
       candidate.panchayat_ids=Array.isArray(profile.assigned_panchayat_ids)&&profile.assigned_panchayat_ids.length?profile.assigned_panchayat_ids:(candidate.panchayat_ids||[]);
       candidate.gram_panchayats=Array.isArray(profile.assigned_gram_panchayats)&&profile.assigned_gram_panchayats.length?profile.assigned_gram_panchayats:(candidate.gram_panchayats||[]);
       if(isGlobalPanchayatLogin()){
         const selected=globalPanchayatOptions.find(x=>String(x.id)===String(currentAccess.panchayat_id));
         if(selected){
           candidate.gram_panchayat=selected.gram_panchayat||candidate.gram_panchayat;
           candidate.panchayat_samiti=selected.panchayat_samiti||candidate.panchayat_samiti;
           candidate.district=selected.district||candidate.district;
         }
       }

       // Profile loads after the first dashboard render; update the visible
       // candidate photo immediately instead of waiting for another login.
       const avatar=document.querySelector(".demoAvatar");
       if(avatar){
         avatar.innerHTML=candidate.photo_url
           ? '<img src="'+e(candidate.photo_url)+'" alt="Candidate photo" onerror="this.remove();this.parentNode.textContent=\''+e((candidate.hindi_name||candidate.name||"प").slice(0,1))+'\'">'
           : e((candidate.hindi_name||candidate.name||"प").slice(0,1));
       }
     }
     candidate.hindi_gram_panchayat=await hindiPlaceName(candidate.gram_panchayat);
     candidate.hindi_panchayat_samiti=await hindiPlaceName(candidate.panchayat_samiti);
     candidate.hindi_district=await hindiPlaceName(candidate.district);
     await prepareCandidateHindiHeader();
     await refreshCandidateHeaderText();
     const wardScoped=String(candidate.post||"")==="Ward Panch"&&String(candidate.ward_no||"").trim();
     const allowedVoterIds=wardScoped?new Set(voters.map(v=>String(v.id))):null;
     const scopedContacts=wardScoped?(cs?.data||[]).filter(x=>allowedVoterIds.has(String(x.voter_id))):(cs?.data||[]);
     if(isPanchayatSamitiMemberLogin()){
       psAllContactRows=cs?.data||[];
       psAllAdditionRows=ar?.data||[];
       psAllHouseOverrideRows=ho?.data||[];
       psAllMobileRows=vm?.data||psAllMobileRows||[];
       if(selectedPSPanchayatId){
         const selectedIds=new Set(psAllVoters.filter(v=>String(v.panchayat_id)===selectedPSPanchayatId).map(v=>String(v.id)));
         contactMap=new Map(psAllContactRows.filter(x=>selectedIds.has(String(x.voter_id))).map(x=>[String(x.voter_id),x]));
         additionRows=psAllAdditionRows.filter(x=>String(x.panchayat_id)===selectedPSPanchayatId);
         houseOverrideMap=new Map(psAllHouseOverrideRows.filter(x=>String(x.panchayat_id)===selectedPSPanchayatId).map(x=>[String(x.voter_id),x]));
         voterMobileMap=new Map(psAllMobileRows.filter(x=>String(x.panchayat_id)===selectedPSPanchayatId).map(x=>[String(x.voter_id),x]));
         renderRows();
       }
     }else{
       contactMap=new Map(scopedContacts.map(x=>[String(x.voter_id),x]));
       additionRows=wardScoped?(ar?.data||[]).filter(x=>String(x.ward||"").trim()===String(candidate.ward_no||"").trim()):(ar?.data||[]);
       houseOverrideMap=new Map((ho?.data||[]).map(x=>[String(x.voter_id),x]));
       if(!vm?.error && Array.isArray(vm?.data)){
         voterMobileMap=new Map(vm.data.map(x=>[String(x.voter_id),x]));
       }
       renderRows();
     }
   }).catch(e=>console.warn("Optional data refresh skipped:",e));
 })();
}

const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\u0900-\u097f]+/g,"");
const sk=s=>norm(s).replace(/chh/g,"ch").replace(/sh/g,"s").replace(/ph/g,"f").replace(/bh/g,"b").replace(/dh/g,"d").replace(/th/g,"t").replace(/kh/g,"k").replace(/gh/g,"g").replace(/jh/g,"j").replace(/w/g,"v").replace(/[aeiouy]/g,"");
function smart(a){return [...new Set(a.filter(x=>x!==null&&x!==undefined&&String(x)!==""))].sort((a,b)=>{const an=Number(a),bn=Number(b);return !isNaN(an)&&!isNaN(bn)?an-bn:String(a).localeCompare(String(b),"hi")})}
function effectiveHouse(v){const x=houseOverrideMap.get(String(v?.id));return x?.local_house_no??v?.house_no??""}
function originalHouse(v){return v?.house_no??""}
function uniq(k,base=voters){return smart(base.map(x=>k==="house_no"?effectiveHouse(x):x[k]))}
function options(k,label,base=voters){return `<option value="">${label}</option>`+uniq(k,base).map(x=>`<option value="${e(x)}">${e(x)}</option>`).join("")}
function hindiPostName(post){
 const m={
  "Sarpanch":"सरपंच पद प्रत्याशी",
  "Ward Panch":"वार्ड पंच पद प्रत्याशी",
  "Panchayat Samiti Member":"पंचायत समिति सदस्य पद प्रत्याशी",
  "Zila Parishad Member":"जिला परिषद सदस्य पद प्रत्याशी"
 };
 const raw=String(post||"").trim();
 if(!raw)return "";
 if(m[raw])return m[raw];
 if(/पद प्रत्याशी$/u.test(raw))return raw;
 return raw+" पद प्रत्याशी";
}
function candidatePhotoHtml(url,name){
 const fallback=e((name||"प").slice(0,1));
 return url?'<img src="'+e(url)+'" alt="Candidate Photo" onerror="this.outerHTML=\'<span>'+fallback+'</span>\'">':'<span>'+fallback+'</span>';
}

 app.innerHTML=`

function previewCandidatePhoto(input){
 const file=input?.files?.[0];if(!file)return;
 compressSignupPhoto(file).then(data=>{
   const box=document.getElementById("profilePhotoPreview");
   if(box)box.innerHTML='<img src="'+e(data)+'" style="width:100%;height:100%;object-fit:cover" alt="New Photo">';
   input.dataset.compressed=data;
 }).catch(err=>{const m=document.getElementById("profileMsg");if(m)m.textContent=err.message||"Photo process नहीं हो सकी";});
}
async function saveCandidateProfile(){
 const msg=document.getElementById("profileMsg");if(msg)msg.textContent="Profile save हो रही है…";
 const mobile=(document.getElementById("profileMobile")?.value||"").replace(/\D/g,"");
 const whatsapp=(document.getElementById("profileWhatsApp")?.value||"").replace(/\D/g,"");
 if(mobile && mobile.length!==10){msg.textContent="Mobile Number 10 digits का होना चाहिए।";return}
 if(whatsapp && whatsapp.length!==10){msg.textContent="WhatsApp Number 10 digits का होना चाहिए।";return}
 const file=document.getElementById("profilePhoto");
 let photo=file?.dataset?.compressed||"";
 if(file?.files?.[0]&&!photo)photo=await compressSignupPhoto(file.files[0]);
 // Do not upsert a partial candidate_profiles row: candidate_name and other
 // required profile fields are NOT NULL. Update the existing profile instead.
 const changes={mobile,whatsapp,updated_at:new Date().toISOString()};
 if(photo)changes.photo_url=photo;
 const {data,error}=await sb.from("candidate_profiles")
   .update(changes)
   .eq("user_id",currentUser.id)
   .select()
   .single();
 if(error){console.error(error);msg.textContent="Profile save नहीं हुई: "+error.message;return}

 // Keep the same profile values in Supabase Auth metadata as a persistent
 // fallback. updateUser merges user_metadata and does not change login email.
 if(photo){
   const {error:authMetaError}=await sb.auth.updateUser({data:{
     photo_url:photo,
     mobile:mobile||candidate.mobile||"",
     whatsapp:whatsapp||candidate.whatsapp||""
   }});
   if(authMetaError) console.warn("Auth metadata photo backup failed:",authMetaError);
 }

 candidate.mobile=data.mobile||mobile;
 candidate.whatsapp=data.whatsapp||whatsapp;
 candidate.photo_url=(data.photo_url&&String(data.photo_url).trim())?data.photo_url:(photo||candidate.photo_url||"");
 msg.textContent="✓ Profile successfully updated.";
 setTimeout(()=>dashboard(),500);
}
function halfMaskNumber(value){
 const s=String(value??"");
 if(!s)return s;
 if(s.length<=2)return "*"+s.slice(-1);
 const hide=Math.max(1,Math.ceil(s.length/2));
 return "*".repeat(hide)+s.slice(hide);
}
function isGlobalPanchayatLogin(){
 return globalPanchayatAccess===true;
}
function globalPanchayatSelectorHtml(){
 if(!isGlobalPanchayatLogin())return "";
 const rows=globalPanchayatOptions||[];
 const selected=rows.find(x=>String(x.id)===String(currentAccess?.panchayat_id||selectedGlobalPanchayatId||""))||rows[0]||{};
 const selectedDistrict=String(selected.district||"");
 const selectedSamiti=String(selected.panchayat_samiti||"");
 const districts=[...new Set(rows.map(x=>String(x.district||"")).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"hi"));
 const samitis=[...new Set(rows.filter(x=>String(x.district||"")===selectedDistrict).map(x=>String(x.panchayat_samiti||"")).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"hi"));
 const panchayats=rows.filter(x=>String(x.district||"")===selectedDistrict&&String(x.panchayat_samiti||"")===selectedSamiti);
 const districtOpts=districts.map(x=>"<option value=\""+e(x)+"\" "+(x===selectedDistrict?"selected":"")+">"+e(x)+"</option>").join("");

async function startRazorpayCheckout(){
 try{
  if(!window.Razorpay){alert("Razorpay Checkout load नहीं हुआ। Page refresh करके फिर try करें।");return}
  let {data:{session}}=await sb.auth.getSession();
  if(!session?.access_token){
    const refreshed=await sb.auth.refreshSession();
    session=refreshed?.data?.session||null;
  }
  if(!session?.access_token){alert("Login session नहीं मिला। कृपया फिर login करें।");return}

  const couponCode=String(window.PANCHAYAT_APPLIED_COUPON||"");
  const orderRes=await fetch("/api/create-order",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer "+session.access_token
    },
    body:JSON.stringify({coupon_code:couponCode})
  });

  const order=await orderRes.json().catch(()=>({}));
  if(!orderRes.ok){
    alert("Razorpay order create नहीं हुआ: "+(order.error||"Unknown error"));
    return;
  }

  document.getElementById("fullAccessPayDlg")?.close();

  const rz=new Razorpay({
    key:order.key_id,
    amount:order.amount,
    currency:order.currency||"INR",
    name:"PanchayatX",
    description:(order.election_post||"Candidate")+" Lifetime Full Access — ₹"+Number(order.rupees||0).toLocaleString("en-IN"),
    order_id:order.order_id,
    prefill:{
      name:candidate?.hindi_name||candidate?.name||"",
      email:currentUser?.email||"",
      contact:candidate?.mobile||""
    },
    notes:{purpose:"PanchayatX Lifetime Full Access"},
    config:{
      display:{
        blocks:{
          upi:{
            name:"Pay with PhonePe / UPI",
            instruments:[
              {method:"upi"}
            ]
          }
        },
        sequence:["block.upi"],
        preferences:{
          show_default_blocks:true
        }
      }
    },
    theme:{color:"#087451"},
    handler:async function(resp){
      try{
        let {data:{session:verifySession}}=await sb.auth.getSession();
        if(!verifySession?.access_token){
          const refreshed=await sb.auth.refreshSession();
          verifySession=refreshed?.data?.session||null;
        }

        const vr=await fetch("/api/verify-payment",{
          method:"POST",
          headers:{
            "Content-Type":"application/json",
            "Authorization":"Bearer "+(verifySession?.access_token||"")
          },
          body:JSON.stringify({
            razorpay_payment_id:resp.razorpay_payment_id,
            razorpay_order_id:resp.razorpay_order_id,
            razorpay_signature:resp.razorpay_signature
          })
        });

        const verified=await vr.json().catch(()=>({}));
        if(!vr.ok||!verified?.verified){
          alert("Payment हुआ लेकिन verification failed: "+(verified.error||"Unknown error"));
          return;
        }

        alert("✅ Payment successfully verified. Amount ₹"+Number(verified.amount||0).toLocaleString("en-IN")+".");
      }catch(err){
        alert("Payment verification error: "+(err?.message||err));
      }
    },
    modal:{
      ondismiss:function(){
        console.log("Razorpay checkout cancelled by user");
      }
    }
  });

  rz.on("payment.failed",function(resp){
    alert("Payment failed: "+(resp?.error?.description||"Please try again"));
  });

  rz.open();
 }catch(err){
  console.error("Razorpay checkout error",err);
  alert("Razorpay payment शुरू नहीं हुआ: "+(err?.message||err));
 }
}

const DV={"अ":"a","आ":"aa","इ":"i","ई":"ee","उ":"u","ऊ":"oo","ए":"e","ऐ":"ai","ओ":"o","औ":"au","ऋ":"ri"},DC={"क":"k","ख":"kh","ग":"g","घ":"gh","ङ":"ng","च":"ch","छ":"chh","ज":"j","झ":"jh","ञ":"ny","ट":"t","ठ":"th","ड":"d","ढ":"dh","ण":"n","त":"t","थ":"th","द":"d","ध":"dh","न":"n","प":"p","फ":"ph","ब":"b","भ":"bh","म":"m","य":"y","र":"r","ल":"l","व":"v","श":"sh","ष":"sh","स":"s","ह":"h","ळ":"l"},DM={"ा":"aa","ि":"i","ी":"ee","ु":"u","ू":"oo","ृ":"ri","े":"e","ै":"ai","ो":"o","ौ":"au","ं":"n","ँ":"n","ः":"h","्":""};
function roman(s){s=String(s||"");let o="";for(let i=0;i<s.length;i++){let ch=s[i];if(DV[ch]){o+=DV[ch];continue}if(DC[ch]){let nx=s[i+1];o+=DC[ch];if(DM[nx]!==undefined){o+=DM[nx];i++}else o+="a";continue}if(DM[ch]!==undefined){o+=DM[ch];continue}o+=ch}return norm(o).replace(/aa/g,"a").replace(/ee/g,"i").replace(/oo/g,"u").replace(/ph/g,"f").replace(/sh/g,"s").replace(/v/g,"w")}
function matchQ(v,q){if(!q)return true;const nq=norm(q),rq=roman(q),fields=[v.name,v.epic,v.relative_name,v.house_no,v.colony,v.ward,v.polling_station];return fields.some(x=>norm(x).includes(nq)||roman(x).includes(nq)||roman(x).includes(rq))}

async function sharePdfFile(file,title,text){if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){try{await navigator.share({title,text,files:[file]});return}catch(x){if(x.name==="AbortError")return}}const u=URL.createObjectURL(file),a=document.createElement("a");a.href=u;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);alert("PDF तैयार है। WhatsApp में attachment के रूप में share करें।")}

async function saveFamilyShareMessage(){
 const ta=document.getElementById("familyShareMessage");
 if(!ta)return false;
 const msg=ta.value.trim();
 if(!msg){alert("Message खाली नहीं हो सकता।");return false}
 const uid=currentUser?.id;
 const pid=currentAccess?.panchayat_id||candidate?.panchayat_id||null;
 if(!uid||!pid){alert("Candidate session/Panchayat information नहीं मिली। कृपया logout करके फिर login करें।");return false}
 try{
  const payload={user_id:uid,panchayat_id:pid,family_share_message:msg,updated_at:new Date().toISOString()};
  const {data,error}=await sb.from("candidate_share_settings")
    .upsert(payload,{onConflict:"user_id,panchayat_id"})
    .select("family_share_message")
    .single();
  if(error)throw error;
  familyShareMessage=data?.family_share_message||msg;
  try{localStorage.setItem("family_share_message_"+uid+"_"+pid,familyShareMessage)}catch(_){}
  alert("✅ WhatsApp message save हो गया।");
  return true;
 }catch(error){
  console.error("Family WhatsApp message save failed:",error);
  alert("❌ Message save नहीं हुआ: "+(error?.message||String(error)));
  return false;
 }
}

धन्यवाद।`;

sb.auth.onAuthStateChange((event,session)=>{
 if(event==="PASSWORD_RECOVERY"&&session){showRecoveryPasswordForm(session);return}
 if(event==="SIGNED_OUT"){currentUser=null;currentAccess=null}
});
// Keep Login and New Candidate creation on distinct URLs.
const loginParams=new URLSearchParams(location.search);
const initialSignupMode=loginParams.get("signup")==="1";
const initialRecoveryMode=loginParams.get("recovery")==="1" || /(?:^#|&)type=recovery(?:&|$)/.test(location.hash||"");
if(initialSignupMode){
 signupView();
}else if(initialRecoveryMode){
 // Password-recovery links must never open the candidate dashboard automatically.
 loginView("Password reset link verify हो रहा है…");
 (async()=>{
   try{
     let session=await ensureRecoverySession();
     if(!session){
       await new Promise(resolve=>setTimeout(resolve,350));
       session=await ensureRecoverySession();
     }
     if(session){
       showRecoveryPasswordForm(session);
     }else{
       loginView("Password reset link invalid या expired है। नया reset link भेजें।");
     }
   }catch(err){
     console.error("Recovery session load failed:",err);
     loginView("Password reset link verify नहीं हो सका। नया reset link भेजें।");
   }
 })();
}else{
 const isDashboardRoute=location.pathname==="/dashboard"||location.pathname==="/dashboard/"||location.pathname.startsWith("/dashboard/");
 if(isDashboardRoute){
   document.body.classList.remove("authPage");
   document.querySelector("header").style.display="none";
   logout.classList.add("hidden");
   app.innerHTML='<div style="min-height:100vh;background:#f3f7f4"></div>';
 }else{
   loginView();
 }
 (async()=>{
  try{
    let {data:{session}}=await sb.auth.getSession();
    if(!session?.user){
      try{
        const refreshed=await sb.auth.refreshSession();
        session=refreshed?.data?.session||null;
      }catch(refreshErr){
        console.warn("Initial session refresh failed:",refreshErr);
      }
    }
    if(session?.user){
      sb.functions.setAuth(session.access_token);
      await load(session.user);
    }else{
      if(isDashboardRoute)history.replaceState({},document.title,"/login/");
      loginView();
    }
  }catch(err){
    console.error("Initial session load failed:",err);
    if(isDashboardRoute)history.replaceState({},document.title,"/login/");
    loginView("Login session load नहीं हो सका। कृपया फिर से Login करें।");
  }
 })();
