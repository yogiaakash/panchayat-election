<script>
const SUPABASE_URL="https://ieoltipygxawhsvlxnsj.supabase.co", SUPABASE_PUBLISHABLE_KEY="sb_publishable_AzM0AxHgmX2a6-9On5jgNg_7SuasTXH";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const app=document.getElementById("app"), logout=document.getElementById("logout");
let candidate=null,voters=[],page=1,currentUser=null,currentAccess=null,contactMap=new Map(),additionRows=[]; const PER=40;

const DEV_TO_LAT={"क":"k","ख":"kh","ग":"g","घ":"gh","च":"ch","छ":"chh","ज":"j","झ":"jh","ट":"t","ठ":"th","ड":"d","ढ":"dh","त":"t","थ":"th","द":"d","ध":"dh","न":"n","प":"p","फ":"ph","ब":"b","भ":"bh","म":"m","य":"y","र":"r","ल":"l","व":"v","श":"sh","ष":"sh","स":"s","ह":"h","ा":"a","ि":"i","ी":"i","ु":"u","ू":"u","े":"e","ै":"ai","ो":"o","ौ":"au","ं":"n","ँ":"n","ः":"h","्":""};
function latinize(v){return String(v??"").split("").map(ch=>DEV_TO_LAT[ch]??ch).join("").toLowerCase().replace(/[^a-z0-9]+/g," ").trim()}
const e=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function loginView(msg=""){
 logout.classList.add("hidden");
 app.innerHTML=`<div class="card login"><h2>Candidate Login</h2><p class="muted">अपने अधिकृत Email और Password से लॉगिन करें।</p>
 <label>Email</label><input id="email" type="email" autocomplete="username">
 <label>Password</label><input id="password" type="password" autocomplete="current-password">
 <button class="btn primary" style="width:100%;margin-top:16px" onclick="signIn()">Login</button>
 <p id="msg" class="error">${e(msg)}</p></div>`;
}
async function signIn(){
 const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
 document.getElementById("msg").textContent="Signing in…";
 const {error}=await sb.auth.signInWithPassword({email,password});
 if(error){document.getElementById("msg").textContent=error.message;return}
 await load();
}
logout.onclick=async()=>{await sb.auth.signOut();candidate=null;voters=[];loginView()};
async function load(){
 const {data:{user}}=await sb.auth.getUser();
 if(!user){loginView();return}
 currentUser=user;

 // New model: access belongs to Panchayat, not only to a candidate.
 const {data:access,error:ae}=await sb.from("panchayat_access")
   .select("panchayat_id,candidate_id,access_level,status,expires_at")
   .eq("user_id",user.id).eq("status","active")
   .or("expires_at.is.null,expires_at.gt."+new Date().toISOString())
   .limit(1).maybeSingle();

 if(ae||!access){
   loginView("इस login को किसी पंचायत का active access नहीं मिला है। Admin से संपर्क करें।");
   await sb.auth.signOut();return;
 }

 currentAccess=access;
 const {data:p,error:pe}=await sb.from("panchayats").select("*").eq("id",access.panchayat_id).maybeSingle();
 if(pe||!p){loginView("Panchayat profile load नहीं हो सका।");await sb.auth.signOut();return}

 // Candidate branding is optional. A Panchayat-access user can work without a candidate row.
 let c=null;
 if(access.candidate_id){
   const {data:linked}=await sb.from("candidates").select("*").eq("id",access.candidate_id).maybeSingle();
   c=linked||null;
 }
 if(!c){
   const {data:owned}=await sb.from("candidates").select("*").eq("owner_user_id",user.id).eq("active",true).limit(1).maybeSingle();
   c=owned||null;
 }
 candidate=c?{...c,gram_panchayat:p.gram_panchayat,panchayat_samiti:p.panchayat_samiti,district:p.district,photo_url:"",symbol_url:"",banner_url:""}:{
   id:null,name:"Panchayat Workspace",hindi_name:"पंचायत कार्यक्षेत्र",post:"",active:true,
   gram_panchayat:p.gram_panchayat,panchayat_samiti:p.panchayat_samiti,district:p.district,
   photo_url:"",symbol_url:"",banner_url:""
 };
 if(c){
   try{const {data:branding,error:be}=await sb.functions.invoke("candidate-branding-urls");if(!be&&branding)candidate={...candidate,...branding}}catch(_){}
 }

 let allVoters=[];
 for(let from=0;;from+=1000){
   const {data:batch,error:ve}=await sb.from("voters").select("*").eq("panchayat_id",access.panchayat_id).order("id",{ascending:true}).range(from,from+999);
   if(ve){loginView("Voter data load error: "+ve.message);return}
   allVoters.push(...(batch||[]));
   if(!batch||batch.length<1000)break;
 }
 voters=allVoters;
 const [{data:cs},{data:ar}]=await Promise.all([
   sb.from("voter_contact_status").select("*").eq("panchayat_id",access.panchayat_id),
   sb.from("voter_addition_requests").select("*").eq("panchayat_id",access.panchayat_id).order("created_at",{ascending:false})
 ]);
 contactMap=new Map((cs||[]).map(x=>[String(x.voter_id),x]));
 additionRows=ar||[];
 logout.classList.remove("hidden");dashboard();
}
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\u0900-\u097f]+/g,"");
const sk=s=>norm(s).replace(/chh/g,"ch").replace(/sh/g,"s").replace(/ph/g,"f").replace(/bh/g,"b").replace(/dh/g,"d").replace(/th/g,"t").replace(/kh/g,"k").replace(/gh/g,"g").replace(/jh/g,"j").replace(/w/g,"v").replace(/[aeiouy]/g,"");
function smart(a){return [...new Set(a.filter(x=>x!==null&&x!==undefined&&String(x)!==""))].sort((a,b)=>{const an=Number(a),bn=Number(b);return !isNaN(an)&&!isNaN(bn)?an-bn:String(a).localeCompare(String(b),"hi")})}
function uniq(k,base=voters){return smart(base.map(x=>x[k]))}
function options(k,label,base=voters){return `<option value="">${label}</option>`+uniq(k,base).map(x=>`<option value="${e(x)}">${e(x)}</option>`).join("")}
function dashboard(){
 const c=candidate;
 app.innerHTML=`<div class="card hero">${c.photo_url?`<img src="${e(c.photo_url)}" alt="Candidate photo" referrerpolicy="no-referrer" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><div style="display:none;width:82px;height:82px;border-radius:50%;border:3px solid #fff;place-items:center;font-size:28px;font-weight:900">${e((c.hindi_name||c.name||"P").slice(0,1))}</div>`:`<div style="width:82px;height:82px;border-radius:50%;border:3px solid #fff;display:grid;place-items:center;font-size:28px;font-weight:900">${e((c.hindi_name||c.name||"P").slice(0,1))}</div>`}<div><h2 style="margin:3px 0;font-size:25px">${e(c.hindi_name||c.name||"")}</h2><div style="font-size:16px;font-weight:800">${c.post?e(c.post)+" पद प्रत्याशी":"अधिकृत पंचायत कार्यक्षेत्र"}</div><div style="font-size:18px;margin-top:4px"><b>ग्राम पंचायत:</b> ${e(c.gram_panchayat||"")}</div><div class="muted" style="margin-top:3px">${e(c.panchayat_samiti||"")} • ${e(c.district||"")}</div></div></div>
 <div class="fieldtools" id="fieldTools"><div class="fieldcard" id="visitCard"><b>🚶 Visit Tracking</b><span class="muted">संपर्क / मुलाकात / Follow-up</span><div id="contactSummary" style="margin-top:8px;font-weight:900;color:#075b43"></div></div><div class="fieldcard" id="additionCard"><b>➕ New Voter (Supp-2)</b><span class="muted">मतदाता सूची में नाम न मिलने पर सर्वे एंट्री</span><div id="additionSummary" style="margin-top:8px;font-weight:900;color:#77570c"></div></div></div>
 <div id="opsReports" class="card hidden" style="margin:12px 0"></div>
 <div class="quicknav"><button class="quick" onclick="showTab('info')"><span class="ico">🔎</span>मतदाता खोज</button><button class="quick" onclick="showTab('slip')"><span class="ico">📄</span>Ward-wise Voter Slip PDF</button><button class="quick" onclick="focusVisit()"><span class="ico">🚶</span>Visit Tracking</button><button class="quick" onclick="focusAddition()"><span class="ico">➕</span>New Voter (Supp-2) Report</button><button class="quick" onclick="showTab('stats')"><span class="ico">📊</span>Panchayat Statistics</button><button class="quick" onclick="showTab('stats');setTimeout(()=>document.querySelector('.aztools')?.scrollIntoView({behavior:'smooth'}),100)"><span class="ico">🔤</span>A–Z Voter List</button></div>
 <div class="tabs"><button id="tbInfo" class="tabbtn active" onclick="showTab('info')">1. मतदाता जानकारी</button><button id="tbSlip" class="tabbtn" onclick="showTab('slip')">2. मतदाता पर्ची</button><button id="tbStats" class="tabbtn" onclick="showTab('stats')">3. सांख्यिकी + A–Z</button></div>
 <section id="tabSlip" class="tabpane"><div class="card"><h3>📄 Voter Slip Download</h3><p class="muted">Ward चुनकर 9 slips per A4 page PDF बनाएं।</p><select id="slipWard" onchange="updateSlipCount()">${options("ward","वार्ड चुनें")}</select><div id="slipCount" class="muted" style="margin-top:8px">Ward चुनें</div><div id="pdfProgressBox" class="hidden" style="margin-top:10px"><div style="height:10px;background:#e7eee9;border-radius:999px;overflow:hidden"><div id="pdfProgressBar" style="height:100%;width:0;background:#087451"></div></div><div id="pdfProgressText" class="muted" style="margin-top:5px">0%</div></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn primary" onclick="downloadWardPdf()">📄 Generate / Download PDF</button><button class="btn ghost" onclick="shareWardPdf()">↗ Share Ward PDF</button></div></div></section>
 <section id="tabInfo" class="tabpane active"><div class="card stats" style="display:grid;grid-template-columns:repeat(3,1fr);gap:1px;padding:10px;margin-bottom:12px"><div class="stat"><strong id="total">0</strong><span>Voters</span></div><div class="stat"><strong id="male">0</strong><span>Male</span></div><div class="stat"><strong id="female">0</strong><span>Female</span></div><div class="stat"><strong id="wards">0</strong><span>Wards</span></div><div class="stat"><strong id="colonies">0</strong><span>Colonies</span></div><div class="stat"><strong id="houses">0</strong><span>Houses</span></div></div><div class="card"><div class="sectionTitle"><span>🔍</span>मतदाता खोजें / Search Voter</div><div class="filters"><input id="q" placeholder="नाम / Name / Voter ID / रिश्तेदार"><select id="ward">${options("ward","सभी वार्ड")}</select><select id="colony" disabled><option value="">पहले वार्ड चुनें</option></select><select id="house" disabled><option value="">पहले कॉलोनी चुनें</option></select><select id="booth" style="display:none"><option value="">सभी मतदान केंद्र</option></select><button class="btn ghost" onclick="clearFilters()">Reset Filters</button></div></div><div id="familyBox" class="card family"></div><div id="result" style="margin-top:12px"></div></section>
 <section id="tabStats" class="tabpane">
 <div class="card"><div class="sectionTitle"><span>📊</span>Panchayat Statistics</div><div id="pStats"></div></div>
 <div class="card" style="margin-top:12px"><div class="sectionTitle"><span>🔤</span>A–Z Voter List</div>
 <div class="aztools"><input id="azQ" placeholder="English / Hindi name search" oninput="renderAZ()"><select id="azWard" onchange="renderAZ()"><option value="">पूरी पंचायत — Combined</option>${[...new Set(voters.map(v=>String(v.ward||"")))].filter(Boolean).sort().map(w=>`<option value="${e(w)}">Ward ${e(w)}</option>`).join("")}</select><button class="btn ghost" onclick="printAZ()">🖨 PDF</button><button class="btn ghost" onclick="downloadAZCsv()">⬇ CSV</button></div><div id="azResult"></div></div>
 </section>
 <dialog id="detailDlg"><h3>मतदाता विवरण</h3><div id="detailBody"></div><div style="margin-top:12px"><button class="btn ghost" onclick="detailDlg.close()">Close</button></div></dialog>`;
 updateFieldSummary();q.addEventListener("input",()=>{page=1;renderRows()});ward.addEventListener("change",()=>cascade("ward"));colony.addEventListener("change",()=>cascade("colony"));house.addEventListener("change",()=>{page=1;renderRows()});renderRows();renderPanchayatStats();renderAZ();
}

const DV={"अ":"a","आ":"aa","इ":"i","ई":"ee","उ":"u","ऊ":"oo","ए":"e","ऐ":"ai","ओ":"o","औ":"au","ऋ":"ri"},DC={"क":"k","ख":"kh","ग":"g","घ":"gh","ङ":"ng","च":"ch","छ":"chh","ज":"j","झ":"jh","ञ":"ny","ट":"t","ठ":"th","ड":"d","ढ":"dh","ण":"n","त":"t","थ":"th","द":"d","ध":"dh","न":"n","प":"p","फ":"ph","ब":"b","भ":"bh","म":"m","य":"y","र":"r","ल":"l","व":"v","श":"sh","ष":"sh","स":"s","ह":"h","ळ":"l"},DM={"ा":"aa","ि":"i","ी":"ee","ु":"u","ू":"oo","ृ":"ri","े":"e","ै":"ai","ो":"o","ौ":"au","ं":"n","ँ":"n","ः":"h","्":""};
function roman(s){s=String(s||"");let o="";for(let i=0;i<s.length;i++){let ch=s[i];if(DV[ch]){o+=DV[ch];continue}if(DC[ch]){let nx=s[i+1];o+=DC[ch];if(DM[nx]!==undefined){o+=DM[nx];i++}else o+="a";continue}if(DM[ch]!==undefined){o+=DM[ch];continue}o+=ch}return norm(o).replace(/aa/g,"a").replace(/ee/g,"i").replace(/oo/g,"u").replace(/ph/g,"f").replace(/sh/g,"s").replace(/v/g,"w")}
function matchQ(v,q){if(!q)return true;const nq=norm(q),rq=roman(q),fields=[v.name,v.epic,v.relative_name,v.house_no,v.colony,v.ward,v.polling_station];return fields.some(x=>norm(x).includes(nq)||roman(x).includes(nq)||roman(x).includes(rq))}

function rr(v){return [["Ward / वार्ड",v.ward],["क्रम संख्या",v.serial_no],["Voter ID",v.epic],["नाम",v.name],["पिता/पति/अन्य",v.relative_name],["मकान",v.house_no],["कॉलोनी",v.colony],["मतदान केंद्र",v.polling_station],["आयु",v.age],["लिंग",v.gender]]}

</body></html>`}
function voterSlip(j){const v=typeof j==="string"?JSON.parse(j):j,w=open("","_blank");if(!w)return;w.document.write(slipDoc(slipHtml(v),"Voter Slip"));w.document.close();setTimeout(()=>w.print(),350)}

async function makePdfFile(list,filename){if(!window.html2canvas||!window.jspdf)throw new Error("PDF library not loaded");const host=document.createElement("div");host.style.cssText="position:fixed;left:-10000px;top:0;width:794px;background:#fff;z-index:-1";document.body.appendChild(host);const {jsPDF}=window.jspdf,pdf=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});try{for(let i=0;i<list.length;i++){host.innerHTML=slipDoc(neutralSlipHtml(list[i]),"Voter Information Slip").match(/<body>([\s\S]*)<\/body>/i)[1];const st=document.createElement("style");st.textContent='*{box-sizing:border-box}.vslip{width:794px;min-height:1123px;border:1px solid #66736e;padding:24px 25px;background:#fff;color:#111;font-family:"Nirmala UI","Noto Sans Devanagari",Mangal,Arial,sans-serif}.gp{text-align:center;font-size:24px;font-weight:900;margin-top:0}.cand{text-align:center;font-size:22px;font-weight:900;margin-top:7px}.civic{text-align:center;font-size:15px;color:#555;margin-top:8px}.title{text-align:center;font-size:27px;font-weight:900;margin-top:10px}.ref{text-align:center;font-size:13px;color:#777;margin:7px 0 43px}.sliprows{border-top:1px solid #d3d3d3}.sliprow{display:grid;grid-template-columns:32% 68%;align-items:center;min-height:62px;border-bottom:1px solid #d3d3d3}.sliprow b{font-size:15px;padding:12px 5px;color:#444}.sliprow span{font-size:19px;padding:12px 5px;overflow-wrap:anywhere}';host.prepend(st);const canvas=await html2canvas(host,{scale:1.5,backgroundColor:"#fff",useCORS:true});const img=canvas.toDataURL("image/jpeg",.92);if(i)pdf.addPage();pdf.addImage(img,"JPEG",0,0,210,297)}return new File([pdf.output("blob")],filename,{type:"application/pdf"})}finally{host.remove()}}
async function makeWardGridPdf(list,filename,onProgress){
 if(!window.html2canvas||!window.jspdf)throw new Error("PDF library not loaded");
 const host=document.createElement("div");host.style.cssText="position:fixed;left:-10000px;top:0;width:794px;background:#fff;z-index:-1";document.body.appendChild(host);
 const {jsPDF}=window.jspdf,pdf=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
 const wardNo=String(list[0]?.ward||"").padStart(3,"0"), totalPages=Math.ceil(list.length/9);

   <div class="panrow"><b>पंचायत :</b><span>${e(gp)}</span><b>वार्ड :</b><strong>${e(String(v.ward||wardNo).padStart(3,"0"))}</strong></div>

    <div class="r split"><span><b>मकान नं.:</b> ${e(v.house_no||"-")}</span><span><b>लिंग/आयु:</b> ${e(v.gender||"-")} / ${e(v.age||"-")}</span></div>

 </div>`;
 try{
  for(let p=0;p<list.length;p+=9){
   const chunk=list.slice(p,p+9),pageNo=Math.floor(p/9)+1;
   host.innerHTML=`<div class="page"><div class="pagehead"><b>पंचायत आम चुनाव, 2026</b><b>पंचायत: ${e(gp)} &nbsp; वार्ड: ${e(wardNo)}</b><span>Page ${pageNo} of ${totalPages}</span></div><div class="rule"></div><div class="grid">${chunk.map(card).join("")}</div></div>`;
   const st=document.createElement("style");st.textContent='*{box-sizing:border-box}.page{width:794px;height:1123px;padding:13px 14px 12px;background:#fff;color:#111;font-family:"Nirmala UI","Noto Sans Devanagari",Mangal,Arial,sans-serif}.pagehead{height:29px;display:grid;grid-template-columns:1fr 1.4fr .6fr;align-items:center;font-size:11px}.pagehead b:nth-child(2){text-align:center}.pagehead span{text-align:right}.rule{border-top:1px solid #555;margin:1px 0 8px}.grid{height:1054px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px}.slip{border:1.4px dashed #7d8783;position:relative;overflow:hidden;background:#fff;padding:5px 5px 25px}.candbox{height:121px;display:grid;grid-template-columns:1fr 78px;gap:5px;padding:8px 3px 4px}.candtext{text-align:center;display:flex;flex-direction:column;justify-content:center}.gp{font-size:18px;line-height:1.08;font-weight:800;color:#f56a00}.gp strong{font-size:20px}.cname{font-size:13px;line-height:1.15;font-weight:900;color:#176b3b;margin-top:5px}.post{font-size:11px;font-weight:800}.photo{display:flex;align-items:center;justify-content:center}.photo img,.ph{width:72px;height:94px;border:1px solid #555;border-radius:10px;object-fit:cover;background:#eee}.ph{display:flex;align-items:center;justify-content:center;font-size:9px;color:#777}.orange{height:31px;background:#f56a00;color:#fff;margin:0 -5px;display:flex;align-items:center;justify-content:space-between;padding:0 7px;font-size:11px}.orange b{font-size:14px}.panrow{height:43px;display:grid;grid-template-columns:auto 1fr auto auto;gap:5px;align-items:center;border-bottom:1px solid #999;font-size:10px}.panrow span{border:1px solid #777;border-radius:4px;text-align:center;padding:4px 3px;font-weight:800}.panrow strong{font-size:12px}.details{font-size:9.4px;line-height:1.25}.r{padding:3px 2px;border-bottom:1px dashed #bbb;overflow-wrap:anywhere}.split{display:grid;grid-template-columns:1fr 1.25fr;gap:5px}.booth{font-size:8.6px;min-height:30px}.foot{position:absolute;left:5px;right:5px;bottom:5px;height:24px;background:#e7f4e7;border-top:2px solid #77a778;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800}';host.prepend(st);
   const canvas=await html2canvas(host,{scale:1.65,backgroundColor:"#fff",useCORS:true,allowTaint:false});
   if(p)pdf.addPage();pdf.addImage(canvas.toDataURL("image/jpeg",.94),"JPEG",0,0,210,297);if(onProgress)onProgress(Math.min(list.length,p+chunk.length),list.length);
  }
  return new File([pdf.output("blob")],filename,{type:"application/pdf"});
 }finally{host.remove()}
}
async function sharePdfFile(file,title,text){if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){try{await navigator.share({title,text,files:[file]});return}catch(x){if(x.name==="AbortError")return}}const u=URL.createObjectURL(file),a=document.createElement("a");a.href=u;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);alert("PDF तैयार है। WhatsApp में attachment के रूप में share करें।")}

function setPdfProgress(done,total){const box=document.getElementById("pdfProgressBox"),bar=document.getElementById("pdfProgressBar"),txt=document.getElementById("pdfProgressText");if(!box||!bar||!txt)return;box.classList.remove("hidden");const pct=total?Math.round(done*100/total):0;bar.style.width=pct+"%";txt.textContent=`PDF तैयार हो रहा है: ${done}/${total} voters • ${pct}%`}
function resetPdfProgress(){const box=document.getElementById("pdfProgressBox");if(box)setTimeout(()=>box.classList.add("hidden"),1800)}
function selectedWardVoters(){
 const w=document.getElementById("slipWard")?.value||document.getElementById("ward")?.value||"";
 if(!w){alert("पहले Ward चुनें।");return []}
 return voters.filter(v=>String(v.ward)===String(w)).sort((a,b)=>(Number(a.serial_no)||0)-(Number(b.serial_no)||0));
}
async function downloadWardPdf(){
 const a=selectedWardVoters(); if(!a.length)return;
 try{
  const w=document.getElementById("slipWard")?.value||document.getElementById("ward")?.value||"";
  setPdfProgress(0,a.length);const file=await makeWardGridPdf(a,`Ward_${w}_Voter_Slips.pdf`,setPdfProgress);
  const u=URL.createObjectURL(file),ln=document.createElement("a");
  ln.href=u;ln.download=file.name;document.body.appendChild(ln);ln.click();ln.remove();
  setTimeout(()=>URL.revokeObjectURL(u),3000);resetPdfProgress();
 }catch(x){alert("Ward PDF तैयार नहीं हो सका: "+x.message)}
}
