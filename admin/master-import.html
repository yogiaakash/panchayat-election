<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Master Voter Import — Panchayat Digital</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>body{font-family:Arial,"Noto Sans Devanagari",sans-serif;background:#f3f7f5;color:#17342c;margin:0}header{background:#176451;color:white;padding:20px;font-size:22px;font-weight:800}.wrap{max-width:1050px;margin:25px auto;padding:0 15px}.card{background:white;border:1px solid #d9e7e1;border-radius:18px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}label{font-weight:700;display:block;margin:8px 0 5px}input,button{width:100%;padding:12px;border:1px solid #cfe0d9;border-radius:10px;box-sizing:border-box}button{background:#176451;color:white;font-weight:800;cursor:pointer;margin-top:14px}.muted{color:#6b7d77}.good{color:#067647}.bad{color:#b42318}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.stat{background:#eaf5f1;padding:14px;border-radius:12px;text-align:center}.stat b{display:block;font-size:22px}@media(max-width:700px){.grid,.stats{grid-template-columns:1fr}}</style></head><body><header>Panchayat Digital — Master Voter Import</header><div class="wrap">
<div class="card"><h2>1. Admin Login</h2><input id="email" value="akashyogi1990@gmail.com" type="email"><input id="password" style="margin-top:8px" type="password" placeholder="Admin password"><button onclick="login()">Login</button><p id="authmsg" class="muted"></p></div>
<div class="card"><h2>2. Upload Master Excel</h2><div class="grid"><div><label>District</label><input id="district" placeholder="जयपुर"></div><div><label>Panchayat Samiti</label><input id="ps" placeholder="जमवा रामगढ़"></div><div><label>Gram Panchayat</label><input id="gp" placeholder="अजबपुरा–बृजपुरा"></div></div><label>Excel (.xlsx/.xls)</label><input id="file" type="file" accept=".xlsx,.xls" onchange="preview()"><p id="previewmsg" class="muted">Excel चुनें।</p><div id="previewbox"></div><button id="importbtn" onclick="doImport()" disabled>Validate & Import</button><p id="status"></p></div>
<div class="card"><h2>Import Result</h2><div class="stats"><div class="stat"><b id="sTotal">0</b>Total</div><div class="stat"><b id="sImported">0</b>Imported</div><div class="stat"><b id="sDup">0</b>Duplicate</div><div class="stat"><b id="sErr">0</b>Error</div><div class="stat"><b id="sWard">0</b>Wards</div></div></div></div>
<script>
const sb=supabase.createClient("https://ieoltipygxawhsvlxnsj.supabase.co","sb_publishable_AzM0AxHgmX2a6-9On5jgNg_7SuasTXH");
let mapped=[];
const aliases={serial_no:["क्रम संख्या"],epic:["वोटर कार्ड नंबर"],name:["मतदाता का नाम"],relative_name:["पिता / पति / अन्य का नाम"],house_no:["मकान नंबर"],colony:["कॉलोनी / क्षेत्र का नाम"],polling_station:["मतदान केंद्र का नाम"],age:["आयु"],gender:["लिंग"],ward:["वार्ड संख्या"]};
function pick(r,a){for(const k of a)if(r[k]!==undefined)return r[k];return ""}
async function login(){const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});authmsg.textContent=error?error.message:"Admin login successful ✓";authmsg.className=error?"bad":"good"}
async function preview(){const f=file.files[0];if(!f)return;const wb=XLSX.read(await f.arrayBuffer());const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:"",raw:false});mapped=rows.map(r=>Object.fromEntries(Object.entries(aliases).map(([k,a])=>[k,pick(r,a)]))).filter(x=>String(x.name).trim());previewmsg.textContent=mapped.length+" valid voter rows found.";previewmsg.className=mapped.length?"good":"bad";importbtn.disabled=!mapped.length;previewbox.innerHTML=mapped.length?'<p class="muted">First voter: '+String(mapped[0].name).replace(/[<>]/g,"")+' | Ward: '+String(mapped[0].ward).replace(/[<>]/g,"")+'</p>':""}
async function doImport(){const d=district.value.trim(),p=ps.value.trim(),g=gp.value.trim(),f=file.files[0];if(!d||!p||!g||!f)return alert("District, Panchayat Samiti, Gram Panchayat और Excel required हैं.");if(!confirm(d+" → "+p+" → "+g+"\n\n"+mapped.length+" voters import करें?"))return;importbtn.disabled=true;status.textContent="Importing…";status.className="muted";const {data,error}=await sb.functions.invoke("admin-master-voter-import",{body:{district:d,panchayat_samiti:p,gram_panchayat:g,file_name:f.name,rows:mapped}});importbtn.disabled=false;if(error||data?.error){let m=data?.error||error?.message||"Import failed";try{if(error?.context){const j=await error.context.json();m=j?.error||m}}catch(_){}status.textContent=m;status.className="bad";return}sTotal.textContent=data.total_rows;sImported.textContent=data.imported_rows;sDup.textContent=data.duplicate_rows;sErr.textContent=data.error_rows;sWard.textContent=data.ward_count;status.textContent="Import completed ✓ Panchayat total voters: "+data.total_voters;status.className="good"}
</script></body></html>
