<script>
const sb=supabase.createClient("https://ieoltipygxawhsvlxnsj.supabase.co","sb_publishable_AzM0AxHgmX2a6-9On5jgNg_7SuasTXH"), ADMIN_EMAIL="akashyogi1990@gmail.com", app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function login(){app.innerHTML=`<div class="card" style="max-width:420px;margin:70px auto"><h2>Admin Login</h2><p class="muted">${ADMIN_EMAIL}</p><label>Password</label><input id=p type=password><button style="margin-top:15px" onclick="go()">Login</button><p id=m class=bad></p><hr><p class=muted>पहली बार? नीचे “Create/Link Admin Account” दबाएँ।</p><input id=np type=password placeholder="New password (min 8 chars)"><button style="margin-top:10px;background:#52677f" onclick="signup()">Create/Link Admin Account</button></div>`}
async function signup(){let password=np.value;if(password.length<8){m.textContent="Password कम से कम 8 characters रखें";return} let {data,error}=await sb.auth.signUp({email:ADMIN_EMAIL,password}); if(error){m.textContent=error.message;return} m.textContent="Account request created. Email confirmation required हो सकती है। Login के बाद admin linking complete करनी होगी.";m.className="good"}
async function go(){let {error}=await sb.auth.signInWithPassword({email:ADMIN_EMAIL,password:p.value});if(error){m.textContent=error.message;return} await home()}
async function home(){let {data:{user}}=await sb.auth.getUser();if(!user) return login(); if((user.email||"").toLowerCase()!=ADMIN_EMAIL){await sb.auth.signOut();return login()}
 let {data:a}=await sb.from("admin_users").select("*").eq("user_id",user.id).maybeSingle();
 if(!a){app.innerHTML=`<div class=card><h2>One-time Admin Link Required</h2><p>Auth account बन गया है, लेकिन database admin role अभी linked नहीं है.</p><p class=muted>User ID: ${esc(user.id)}</p><p>यह one-time secure database linking अगले setup step में complete होगी.</p><button onclick="sb.auth.signOut().then(login)">Logout</button></div>`;return}
 renderAdmin();
}
async function renderAdmin(){let {data:c}=await sb.from("candidates").select("*").order("created_at",{ascending:false});
app.innerHTML=`<div class=card><h2>Create Paid Candidate</h2><div class=grid>
<div><label>Name</label><input id=name></div><div><label>Hindi Name</label><input id=hindi></div><div><label>Post</label><input id=post value="Sarpanch"></div>

<div><label>Mobile</label><input id=mobile></div><div><label>Candidate Email</label><input id=email type=email></div><div><label>Temporary Password</label><input id=password type=password></div>
<div><label>URL Slug</label><input id=slug placeholder="rampura-rajesh"></div><div><label>Expiry</label><input id=expiry type=date></div><div><label>Candidate Photo</label><input id=photo type=file accept="image/*"></div><div><label>Election Symbol</label><input id=symbol type=file accept="image/*"></div><div><label>Banner</label><input id=banner type=file accept="image/*"></div></div>
<button style="margin-top:14px" onclick="createCandidate()">Create Candidate + Login</button><p id=status></p></div>
<div class=card><h2>Voter Excel Import</h2><label>Candidate</label><select id=cid>${(c||[]).map(x=>`<option value="${x.id}">${esc(x.hindi_name||x.name)} — ${esc(x.gram_panchayat)}</option>`).join("")}</select>
<label>Excel File</label><input id=file type=file accept=".xlsx,.xls">
<label style="display:flex;gap:9px;align-items:center;margin-top:12px"><input id=replaceExisting type=checkbox checked style="width:auto"> Replace existing voter list (पुराना voter data हटाकर नई list डालें)</label>
<button style="margin-top:12px" onclick="importExcel()">Replace / Import Voters</button><p id=istatus></p></div>

async function file64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(",")[1]);r.onerror=reject;r.readAsDataURL(file)})}
async function uploadBrand(candidate_id,kind,file){if(!file)return;const base64=await file64(file);const {data,error}=await sb.functions.invoke("admin-manage-candidate",{body:{action:"branding",candidate_id,kind,base64,content_type:file.type,file_name:file.name}});if(error||data?.error)throw new Error(error?.message||data.error)}
async function createCandidate(){
 const el=id=>document.getElementById(id), st=el("status");
 st.textContent="Creating live candidate…";st.className="muted";
 const body={
  name:el("name").value.trim(),hindi_name:el("hindi").value.trim(),post:el("post").value.trim(),
  district:el("district").value,panchayat_samiti:el("ps").value,gram_panchayat:el("gp").value,
  mobile:el("mobile").value.trim(),email:el("email").value.trim(),password:el("password").value,
  slug:el("slug").value.trim(),subscription_expiry:el("expiry").value||null
 };
 if(!body.name||!body.gram_panchayat||!body.email||!body.password||!body.slug){
  st.textContent="Name, Gram Panchayat, Email, Password और URL Slug required हैं.";st.className="bad";return;
 }
 const {data,error}=await sb.functions.invoke("admin-create-candidate",{body});
 if(error||data?.error){
  let msg=data?.error||error?.message||"Candidate create failed";
  try{if(error?.context){const j=await error.context.json();msg=j?.error||msg}}catch(_){}
  st.textContent="Create failed: "+msg;st.className="bad";return;
 }
 try{
  await uploadBrand(data.candidate.id,"photo",el("photo").files[0]);
  await uploadBrand(data.candidate.id,"symbol",el("symbol").files[0]);
  await uploadBrand(data.candidate.id,"banner",el("banner").files[0]);
  alert("Candidate login created successfully.");
  await renderAdmin();
 }catch(e){
  alert("Candidate login created, but branding upload failed: "+e.message);
  await renderAdmin();
 }
}
async function manageCandidate(j){const x=JSON.parse(j);const name=prompt("Candidate Name",x.name||"");if(name===null)return;const hindi_name=prompt("Hindi Name",x.hindi_name||"");if(hindi_name===null)return;const mobile=prompt("Mobile",x.mobile||"");if(mobile===null)return;const expiry=prompt("Expiry YYYY-MM-DD",x.subscription_expiry||"");if(expiry===null)return;const payment=prompt("Payment: paid / partial / pending",x.payment_status||"paid");if(payment===null)return;const active=confirm((x.active?"Deactivate":"Activate")+" this candidate?\nOK = "+(!x.active?"ACTIVE":"INACTIVE")+"\nCancel = keep current status");const newActive=active?!x.active:x.active;const {data,error}=await sb.functions.invoke("admin-manage-candidate",{body:{action:"update",candidate_id:x.id,name,hindi_name,mobile,subscription_expiry:expiry||null,payment_status:payment,active:newActive}});if(error||data?.error){alert(error?.message||data.error);return}await renderAdmin()}
async function quickBrand(candidate_id,kind){const inp=document.createElement("input");inp.type="file";inp.accept="image/*";inp.onchange=async()=>{try{await uploadBrand(candidate_id,kind,inp.files[0]);alert(kind+" uploaded");await renderAdmin()}catch(e){alert(e.message)}};inp.click()}
const aliases={serial_no:["क्रम संख्या"],epic:["वोटर कार्ड नंबर"],name:["मतदाता का नाम"],relative_name:["पिता / पति / अन्य का नाम"],house_no:["मकान नंबर"],colony:["कॉलोनी / क्षेत्र का नाम"],polling_station:["मतदान केंद्र का नाम"],age:["आयु"],gender:["लिंग"],ward:["वार्ड संख्या"],panchayat:["पंचायत का नाम"]};
function pick(r,arr){for(const k of arr)if(r[k]!==undefined)return r[k];return null}
async function importExcel(){
 let f=file.files[0];if(!f)return alert("Excel चुनें");
 istatus.textContent="Reading & validating…";istatus.className="muted";
 let wb=XLSX.read(await f.arrayBuffer());
 let rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
 let candidate_id=cid.value;
 let mapped=rows.map(r=>({candidate_id,...Object.fromEntries(Object.entries(aliases).map(([k,a])=>[k,pick(r,a)]))})).filter(x=>x.name);
 if(!mapped.length){istatus.textContent="Excel में valid voter records नहीं मिले.";istatus.className="bad";return}
 const replacing=document.getElementById("replaceExisting")?.checked;
 if(replacing){
   if(!confirm(`इस candidate के सभी पुराने voters हटाकर ${mapped.length} नए voters डालने हैं?`))return;
   istatus.textContent="Removing old voter list…";
   const {error:de}=await sb.from("voters").delete().eq("candidate_id",candidate_id);
   if(de){istatus.textContent="Old data remove error: "+de.message;istatus.className="bad";return}
 }
 let ok=0;
 for(let i=0;i<mapped.length;i+=500){
   let {error}=await sb.from("voters").insert(mapped.slice(i,i+500));
   if(error){istatus.textContent=`Import stopped at ${ok}: `+error.message;istatus.className="bad";return}
   ok+=Math.min(500,mapped.length-i);
   istatus.textContent=`Imported ${ok} / ${mapped.length}`;
 }
 await sb.from("voter_imports").insert({candidate_id,file_name:f.name,total_rows:rows.length,imported_rows:ok});
 istatus.textContent=`Done — ${ok} voters ${replacing?"replaced":"imported"}`;istatus.className="good";
}

function fillSelect(el,items,placeholder){
  el.innerHTML='<option value="">'+placeholder+'</option>'+items.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
}
function initHierarchy(){
  const d=document.getElementById("district"); if(!d)return;
  fillSelect(d,Object.keys(RAJ_HIERARCHY).sort(),"Select District");
  fillSelect(document.getElementById("ps"),[],"Select Panchayat Samiti");
  fillSelect(document.getElementById("gp"),[],"Select Gram Panchayat");
}
function loadSamitis(){
  const d=document.getElementById("district").value;
  fillSelect(document.getElementById("ps"),d?Object.keys(RAJ_HIERARCHY[d]||{}).sort():[],"Select Panchayat Samiti");
  fillSelect(document.getElementById("gp"),[],"Select Gram Panchayat");
}
function loadGPs(){
  const d=document.getElementById("district").value, s=document.getElementById("ps").value;
  fillSelect(document.getElementById("gp"),(d&&s?(RAJ_HIERARCHY[d]?.[s]||[]):[]),"Select Gram Panchayat");
}
