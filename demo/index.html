<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panchayat Digital Demo</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}header{background:#123b70;color:#fff;padding:16px 5%;display:flex;justify-content:space-between}.tag{background:#ffdf75;color:#493600;padding:6px 10px;border-radius:18px;font-weight:700}main{max-width:1200px;margin:auto;padding:20px}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 5px 18px #0001}.stats,.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.filters{grid-template-columns:2fr repeat(4,1fr) auto}.num{font-size:27px;font-weight:800;color:#123b70}input,select,button{padding:10px;border:1px solid #d5deea;border-radius:8px;width:100%}button{background:#174d86;color:#fff;cursor:pointer}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:950px}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left}th{background:#eef4fb}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}}</style></head>
<body><header><b>Panchayat Digital — Candidate Demo</b><span class="tag">DEMO • SAMPLE DATA ONLY</span></header><main>
<div class="card"><h2 style="margin:0">राजेश शर्मा</h2><p>सरपंच प्रत्याशी • ग्राम पंचायत रामपुरा</p><small>यह केवल software demonstration है। सभी voter records काल्पनिक sample data हैं।</small></div>
<div class="stats"><div class="card">कुल मतदाता<div class="num" id="total"></div></div><div class="card">पुरुष<div class="num" id="male"></div></div><div class="card">महिला<div class="num" id="female"></div></div><div class="card">मकान<div class="num" id="houses"></div></div></div>
<div class="card filters"><input id="q" placeholder="नाम / EPIC / रिश्तेदार / मकान खोजें"><select id="ward"></select><select id="colony"></select><select id="house"></select><select id="booth"></select><button onclick="clearF()">फ़िल्टर साफ़ करें</button></div>
<div class="card table"><div id="count"></div><table><thead><tr><th>क्र.</th><th>EPIC</th><th>नाम</th><th>पिता/पति</th><th>मकान</th><th>कॉलोनी</th><th>वार्ड</th><th>आयु</th><th>लिंग</th><th>मतदान केंद्र</th></tr></thead><tbody id="rows"></tbody></table><div style="display:flex;gap:8px;justify-content:center;margin-top:12px"><button style="width:auto" onclick="prev()">← Previous</button><span id="pg"></span><button style="width:auto" onclick="next()">Next →</button></div></div></main>
<script>
const DEV_TO_LAT={"क":"k","ख":"kh","ग":"g","घ":"gh","च":"ch","छ":"chh","ज":"j","झ":"jh","ट":"t","ठ":"th","ड":"d","ढ":"dh","त":"t","थ":"th","द":"d","ध":"dh","न":"n","प":"p","फ":"ph","ब":"b","भ":"bh","म":"m","य":"y","र":"r","ल":"l","व":"v","श":"sh","ष":"sh","स":"s","ह":"h","ा":"a","ि":"i","ी":"i","ु":"u","ू":"u","े":"e","ै":"ai","ो":"o","ौ":"au","ं":"n","ँ":"n","ः":"h","्":""};function latinize(v){return String(v??"").split("").map(ch=>DEV_TO_LAT[ch]??ch).join("").toLowerCase().replace(/[^a-z0-9]+/g," ").trim()}
const first=["कैलाश","ललिता देवी","मीना देवी","रामलाल","जगदीश","ओमप्रकाश","प्रेम देवी","सुनीता","राकेश","कविता","दीपक","पूजा"], rel=["नरेंद्र कुमार","कैलाश","रामलाल","मोहनलाल","श्यामलाल"], cols=["मुख्य बाजार","शिव कॉलोनी","नई आबादी","गांधी नगर","अंबेडकर कॉलोनी"], booths=["01 - राजकीय उच्च माध्यमिक विद्यालय, रामपुरा कमरा नंबर 1","02 - राजकीय विद्यालय, रामपुरा कमरा नंबर 2","03 - पंचायत भवन, रामपुरा"];
const V=Array.from({length:5000},(_,i)=>({s:i+1,e:"RMP"+String(i+1).padStart(7,"0"),n:first[i%first.length]+" "+(Math.floor(i/first.length)+1),r:rel[i%rel.length],h:String(Math.floor(i/5)+1),c:cols[Math.floor(i/250)%cols.length],w:String(Math.floor(i/1000)+1).padStart(3,"0"),a:18+(i%63),g:i%2?"स्त्री":"पुरुष",b:booths[Math.floor(i/1700)%booths.length]}));
const $=id=>document.getElementById(id);let F=V,page=1,per=50;
function opt(id,key,label){$(id).innerHTML='<option value="">'+label+'</option>'+[...new Set(V.map(x=>x[key]))].sort((a,b)=>String(a).localeCompare(String(b),'hi',{numeric:true})).map(x=>'<option>'+x+'</option>').join('')}
opt("ward","w","सभी वार्ड");opt("colony","c","सभी कॉलोनी");opt("house","h","सभी मकान");opt("booth","b","सभी मतदान केंद्र");
function filter(){let z=$("q").value.trim().toLocaleLowerCase("hi-IN"),w=$("ward").value,c=$("colony").value,h=$("house").value,b=$("booth").value;F=V.filter(x=>(!w||x.w==w)&&(!c||x.c==c)&&(!h||x.h==h)&&(!b||x.b==b)&&(!z||(()=>{let raw=[x.e,x.n,x.r,x.h,x.c,x.w,x.b].join(" ").toLocaleLowerCase("hi-IN");return raw.includes(z)||latinize(raw).includes(latinize(z))})()));page=1;render()}
["q","ward","colony","house","booth"].forEach(id=>$(id).addEventListener(id=="q"?"input":"change",filter));
function clearF(){["q","ward","colony","house","booth"].forEach(id=>$(id).value="");filter()}
function render(){ $("total").textContent=F.length;$("male").textContent=F.filter(x=>x.g=="पुरुष").length;$("female").textContent=F.filter(x=>x.g=="स्त्री").length;$("houses").textContent=new Set(F.map(x=>x.h)).size;let pages=Math.max(1,Math.ceil(F.length/per)),a=F.slice((page-1)*per,page*per);$("count").textContent=F.length+" records";$("rows").innerHTML=a.map(x=>`<tr><td>${x.s}</td><td>${x.e}</td><td><b>${x.n}</b></td><td>${x.r}</td><td>${x.h}</td><td>${x.c}</td><td>${x.w}</td><td>${x.a}</td><td>${x.g}</td><td>${x.b}</td></tr>`).join("");$("pg").textContent="Page "+page+" / "+pages}
function next(){if(page<Math.ceil(F.length/per)){page++;render()}}function prev(){if(page>1){page--;render()}}render();
</script></body></html>
