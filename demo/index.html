<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panchayat Digital Exact Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f2;color:#15221e;font-family:"Nirmala UI",Mangal,Arial,sans-serif}.app{max-width:850px;margin:auto}.hero{padding:18px 16px;background:linear-gradient(145deg,#0d3f34,#176451);color:#fff}.hero h1{margin:4px 0}.tag{font-size:12px;font-weight:800}.candidate{margin-top:14px;padding:14px;background:#ffffff1c;border:1px solid #ffffff30;border-radius:18px;display:flex;align-items:center;gap:13px}.candidate-photo{width:82px;height:82px;border-radius:50%;background:#fff;border:3px solid #fff;object-fit:cover;object-position:center 18%;display:block;flex:0 0 82px;box-shadow:0 3px 10px #0003}.candidate-info b{font-size:20px}.candidate-info div{margin-top:3px}.slogan{margin-top:8px;padding-top:8px;border-top:1px solid #ffffff38;font-weight:800;font-size:14px;line-height:1.45}main{padding:12px}.box,.card{background:#fff;border:1px solid #dce3df;box-shadow:0 6px 20px #14413614;border-radius:18px}.search{padding:14px}.q{width:100%;height:50px;border:1px solid #bdc9c4;border-radius:13px;padding:0 12px;font-size:16px;margin:10px 0}.filters{display:grid;grid-template-columns:1fr;gap:9px}.filters label{font-size:12px;font-weight:800}.filters select{width:100%;height:45px;border:1px solid #cbd4d0;border-radius:11px;background:#fff}.reset{margin-top:10px;padding:9px 12px;border:0;border-radius:10px;background:#edf2ef;color:#124b3e;font-weight:800}.stats{margin:12px 0;padding:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:1px}.stat{text-align:center;padding:9px;background:#f8faf8}.stat b{display:block;font-size:19px;color:#124b3e}.stat span{font-size:10px;color:#6f7b76}.cards{display:grid;gap:10px}.card{padding:13px}.top{display:flex;justify-content:space-between;gap:8px}.name{font-size:18px;font-weight:900}.id{font:700 11px monospace;background:#eef3f1;padding:5px 7px;border-radius:8px}.rel{font-size:13px;color:#53625c;margin-top:4px}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.pill{font-size:11px;background:#f2f5f3;border:1px solid #e0e6e3;padding:5px 7px;border-radius:999px}.house{background:#fff7e9;color:#795018}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.actions button,.pager button{border:0;border-radius:10px;padding:9px;font-weight:800}.details{background:#edf2ef;color:#124b3e}.pdf{background:#e8f1ff;color:#184e89}.share{background:#fff0e0;color:#8c520e}.family{display:none;padding:14px;margin-bottom:12px}.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin:14px}.pager button{background:#fff;border:1px solid #cad3cf}dialog{width:min(94vw,560px);border:0;border-radius:18px}.row{display:grid;grid-template-columns:120px 1fr;padding:8px 0;border-bottom:1px solid #eee}.row span{font-size:11px;color:#6f7b76}@media(min-width:650px){.filters{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:1fr 1fr}}
</style>
<style>
.sales-wa{position:fixed;right:18px;bottom:18px;z-index:9999;width:60px;height:60px;border-radius:50%;background:#25D366;color:white;text-decoration:none;display:flex;align-items:center;justify-content:center;font:900 30px Arial;box-shadow:0 5px 18px #0004;border:3px solid #fff}
.sales-wa:hover{transform:scale(1.05)}
.sales-wa-label{position:fixed;right:88px;bottom:29px;z-index:9998;background:#fff;color:#174c3d;padding:8px 11px;border-radius:10px;box-shadow:0 3px 12px #0002;font:700 12px Arial}
@media(max-width:600px){.sales-wa-label{display:none}}
</style>
</head><body><div class="app"><header class="hero"><div class="tag">PANCHAYAT DIGITAL</div><h1>ग्राम पंचायत रामपुरा</h1><div class="candidate"><img class="candidate-photo" src="candidate_photo.jpg" alt="Candidate photo"><div class="candidate-info"><b>राजेश शर्मा</b><div>सरपंच प्रत्याशी • ग्राम पंचायत रामपुरा</div><div class="slogan">गाँव के विकास में अपनी भागीदारी निभाएँ — मतदान अवश्य करें।</div></div></div></header><main>
<section class="box search"><b>🔍 मतदाता खोजें / Search Voter</b><input class="q" id="q" placeholder="नाम / Name / Voter ID"><div class="filters"><div><label>1. Ward / वार्ड</label><select id="ward"></select></div><div><label>2. Colony / कॉलोनी</label><select id="colony" disabled></select></div><div><label>3. House No. / मकान नं.</label><select id="house" disabled></select></div></div><button class="reset" id="reset">Reset Filters</button></section>
<section class="box stats"><div class="stat"><b id="total"></b><span>Voters</span></div><div class="stat"><b id="male"></b><span>Male</span></div><div class="stat"><b id="female"></b><span>Female</span></div><div class="stat"><b id="wards"></b><span>Wards</span></div><div class="stat"><b id="colonies"></b><span>Colonies</span></div><div class="stat"><b id="houses"></b><span>Houses</span></div></section>
<section id="family" class="box family"></section><div id="cards" class="cards"></div><div class="pager"><button id="prev">← Previous</button><span id="pg"></span><button id="next">Next →</button></div></main></div>
<dialog id="dlg"><h3>मतदाता विवरण</h3><div id="detail"></div><div class="actions"><button id="dPdf" class="pdf">PDF</button><button id="dShare" class="share">Share</button><button onclick="dlg.close()">Close</button></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script><script src="voters.js"></script><script>
const D=window.VOTERS||[],$=x=>document.getElementById(x),PER=40;let F=D,page=1,sel=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\u0900-\u097f]+/g,"");
// Simple Hindi -> Roman aliases so searches such as Kailash / Lalita / Meena also work.
const DEV_V={"अ":"a","आ":"aa","इ":"i","ई":"ee","उ":"u","ऊ":"oo","ए":"e","ऐ":"ai","ओ":"o","औ":"au","ऋ":"ri"};
const DEV_C={"क":"k","ख":"kh","ग":"g","घ":"gh","ङ":"ng","च":"ch","छ":"chh","ज":"j","झ":"jh","ञ":"ny","ट":"t","ठ":"th","ड":"d","ढ":"dh","ण":"n","त":"t","थ":"th","द":"d","ध":"dh","न":"n","प":"p","फ":"ph","ब":"b","भ":"bh","म":"m","य":"y","र":"r","ल":"l","व":"v","श":"sh","ष":"sh","स":"s","ह":"h","ळ":"l"};
const MAT={"ा":"aa","ि":"i","ी":"ee","ु":"u","ू":"oo","ृ":"ri","े":"e","ै":"ai","ो":"o","ौ":"au","ं":"n","ँ":"n","ः":"h","्":""};
function roman(s){s=String(s||"");let out="";for(let i=0;i<s.length;i++){let ch=s[i];if(DEV_V[ch]){out+=DEV_V[ch];continue}if(DEV_C[ch]){let next=s[i+1];out+=DEV_C[ch];if(MAT[next]!==undefined){out+=MAT[next];i++}else out+="a";continue}if(MAT[ch]!==undefined){out+=MAT[ch];continue}out+=ch}return norm(out).replace(/aa/g,"a").replace(/ee/g,"i").replace(/oo/g,"u").replace(/ph/g,"f").replace(/sh/g,"s").replace(/v/g,"w")}
function nameMatch(v,qraw){const q=norm(qraw), qr=roman(qraw);if(!q)return true;const direct=[v.n,v.r,v.id,v.h,v.c,v.b,v.w,v.s].map(norm);if(direct.some(x=>x.includes(q)))return true;const aliases=[v.n,v.r,v.c].map(roman);return aliases.some(x=>x.includes(q)||x.includes(qr));}
const uniq=a=>[...new Set(a.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"hi",{numeric:true}));
function opts(el,a,label){el.innerHTML='<option value="">'+label+'</option>'+uniq(a).map(x=>'<option>'+esc(x)+'</option>').join("")}
function hc(v){return D.filter(x=>x.w===v.w&&x.c===v.c&&x.h===v.h).length}
function apply(resetPage=true){
  const q=norm(qel.value.trim());
  const w=wardEl.value, c=colonyEl.value, h=houseEl.value;
  F=D.filter(v=>{
    return (!w || String(v.w)===String(w)) &&
           (!c || String(v.c)===String(c)) &&
           (!h || String(v.h)===String(h)) &&
           nameMatch(v,qel.value.trim());
  });
  if(resetPage) page=1;
  render();
}
function updateColony(){
  const w=wardEl.value;
  const rows=w ? D.filter(v=>String(v.w)===String(w)) : [];
  opts(colonyEl,rows.map(v=>v.c),"सभी कॉलोनी");
  colonyEl.disabled=!w;
  opts(houseEl,[],"पहले कॉलोनी चुनें");
  houseEl.disabled=true;
  apply();
}
function updateHouse(){
  const w=wardEl.value, c=colonyEl.value;
  const rows=(w&&c) ? D.filter(v=>String(v.w)===String(w)&&String(v.c)===String(c)) : [];
  opts(houseEl,rows.map(v=>String(v.h)),"सभी मकान");
  houseEl.disabled=!(w&&c);
  apply();
}
function card(v,i){return `<article class="card"><div class="top"><div><div class="name">${esc(v.n)}</div><div class="rel">संबंधी: ${esc(v.r)}</div></div><div class="id">${esc(v.id)}</div></div><div class="meta"><span class="pill">Ward ${esc(v.w)}</span><span class="pill">${esc(v.c)}</span><span class="pill house">🏠 ${esc(v.h)} · ${hc(v)} voters</span><span class="pill">Age ${v.a}</span><span class="pill">${esc(v.g)}</span></div><div class="actions"><button class="details" onclick="show(${i})">Details</button><button class="pdf" onclick="slip(${i})">📄 PDF</button><button class="share" onclick="shareV(${i})">↗ Share</button></div></article>`}
function render(){total.textContent=F.length;male.textContent=F.filter(v=>v.g.includes("पुर")).length;female.textContent=F.filter(v=>v.g.includes("स्त्री")||v.g.includes("महिला")).length;wards.textContent=new Set(F.map(v=>v.w)).size;colonies.textContent=new Set(F.map(v=>v.w+"|"+v.c)).size;houses.textContent=new Set(F.map(v=>v.w+"|"+v.c+"|"+v.h)).size;let st=(page-1)*PER;cards.innerHTML=F.slice(st,st+PER).map((v,j)=>card(v,st+j)).join("");pg.textContent=`Page ${page} / ${Math.max(1,Math.ceil(F.length/PER))}`;familyPanel()}
function rr(v){return [["Ward / वार्ड",v.w],["क्रम संख्या",v.s],["Voter ID",v.id],["नाम",v.n],["पिता/पति/अन्य",v.r],["मकान",v.h],["कॉलोनी",v.c],["मतदान केंद्र",v.b],["आयु",v.a],["लिंग",v.g]]}
function show(i){sel=F[i];detail.innerHTML=rr(sel).map(x=>`<div class="row"><span>${esc(x[0])}</span><b>${esc(x[1])}</b></div>`).join("");dlg.showModal()}
function slipHtml(v){return `<section class="vslip">
  <div class="gp">ग्राम पंचायत रामपुरा</div>
  <div class="cand">राजेश कुमार शर्मा</div>
  <div class="appeal">आपका विश्वास, हमारे गाँव का विकास</div>
  <div class="appeal">🙏 आपका सहयोग एवं आशीर्वाद अपेक्षित है</div>
  <div class="title">मतदाता पर्ची / Voter Slip</div>
  <div class="ref">For voter-list reference only</div>
  <div class="sliprows">
    ${rr(v).map(x=>`<div class="sliprow"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join("")}
  </div>
 </section>`}
function slipDoc(content,title="Voter Slip"){return `<!doctype html><html lang="hi"><head><meta charset="utf-8"><title>${esc(title)}</title><style>
 @page{size:A4;margin:10mm}*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:#111}body{font-family:"Nirmala UI","Noto Sans Devanagari",Mangal,Arial,sans-serif}.vslip{width:100%;min-height:277mm;border:1px solid #66736e;padding:7mm 8mm;page-break-after:always;break-after:page}.vslip:last-child{page-break-after:auto;break-after:auto}.gp{text-align:center;font-size:19px;font-weight:900;line-height:1.25;margin-top:1mm}.cand{text-align:center;font-size:17px;font-weight:900;line-height:1.25;margin-top:1mm}.appeal{text-align:center;font-size:12px;line-height:1.3;margin-top:1mm;color:#444}.title{text-align:center;font-size:21px;font-weight:900;margin-top:3mm;line-height:1.2}.ref{text-align:center;font-size:10px;color:#777;margin:1.5mm 0 10mm}.sliprows{border-top:1px solid #d3d3d3}.sliprow{display:grid;grid-template-columns:32% 68%;align-items:center;min-height:15mm;border-bottom:1px solid #d3d3d3}.sliprow b{font-size:12px;padding:3mm 1mm}.sliprow span{font-size:15px;padding:3mm 1mm;overflow-wrap:anywhere}.sliprow:nth-last-child(-n+2){min-height:14mm}@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
 </style></head><body>${content}</body></html>`}
function printV(v){let w=open("","_blank");w.document.write(slipDoc(slipHtml(v),"Voter Slip"));w.document.close();setTimeout(()=>w.print(),350)}
function slip(i){printV(F[i])}
function neutralSlipHtml(v){return `<section class="vslip">
  <div class="gp">ग्राम पंचायत रामपुरा</div>
  <div class="title">मतदाता सूचना पर्ची / Voter Information Slip</div>
  <div class="ref">For voter-list reference only</div>
  <div class="sliprows">${rr(v).map(x=>`<div class="sliprow"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join("")}</div>
 </section>`}
async function makePdfFile(list,filename){
  if(!window.html2canvas||!window.jspdf) throw new Error("PDF library not loaded");
  const host=document.createElement("div");host.style.cssText="position:fixed;left:-10000px;top:0;width:794px;background:#fff;z-index:-1";document.body.appendChild(host);
  const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
  try{
    for(let i=0;i<list.length;i++){
      host.innerHTML=slipDoc(neutralSlipHtml(list[i]),"Voter Information Slip").match(/<body>([\s\S]*)<\/body>/i)[1];
      const st=document.createElement("style");st.textContent='*{box-sizing:border-box}body{font-family:"Nirmala UI","Noto Sans Devanagari",Mangal,Arial,sans-serif}.vslip{width:794px;min-height:1123px;border:1px solid #66736e;padding:28px 30px;background:#fff;color:#111}.gp{text-align:center;font-size:24px;font-weight:900}.title{text-align:center;font-size:28px;font-weight:900;margin-top:18px}.ref{text-align:center;font-size:13px;color:#777;margin:8px 0 35px}.sliprows{border-top:1px solid #d3d3d3}.sliprow{display:grid;grid-template-columns:32% 68%;align-items:center;min-height:60px;border-bottom:1px solid #d3d3d3}.sliprow b{font-size:16px;padding:12px 5px}.sliprow span{font-size:19px;padding:12px 5px;overflow-wrap:anywhere}';host.prepend(st);
      const canvas=await html2canvas(host,{scale:1.5,backgroundColor:"#ffffff",useCORS:true});
      const img=canvas.toDataURL("image/jpeg",0.92);if(i)pdf.addPage();pdf.addImage(img,"JPEG",0,0,210,297);
    }
    const blob=pdf.output("blob");return new File([blob],filename,{type:"application/pdf"});
  } finally {host.remove()}
}
async function sharePdfFile(file,title,text){
  if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
    try{await navigator.share({title,text,files:[file]});return}catch(e){if(e?.name==="AbortError")return}
  }
  const u=URL.createObjectURL(file),a=document.createElement("a");a.href=u;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);alert("PDF तैयार है। WhatsApp में इस PDF को attachment के रूप में share करें।");
}
async function shareV(i){let v=F[i];try{let file=await makePdfFile([v],`Voter_Slip_${v.id||v.s}.pdf`);await sharePdfFile(file,"Voter Information Slip","मतदाता सूची संदर्भ हेतु सूचना पर्ची")}catch(e){alert("PDF share तैयार नहीं हो सका: "+e.message)}}
function fam(){return wardEl.value&&colonyEl.value&&houseEl.value?D.filter(v=>String(v.w)===String(wardEl.value)&&String(v.c)===String(colonyEl.value)&&String(v.h)===String(houseEl.value)):[]}
function familyPanel(){let a=fam();if(!a.length){family.style.display="none";return}family.style.display="block";family.innerHTML=`<b>🏠 मकान ${esc(houseEl.value)} — ${a.length} मतदाता</b><div style="font-size:12px;color:#6f7b76">${esc(colonyEl.value)} • Ward ${esc(wardEl.value)}</div><div style="margin-top:8px">${a.map(v=>`<div style="padding:6px 0;border-top:1px solid #eee"><b>${esc(v.n)}</b> · ${esc(v.id)}<br><small>${esc(v.r)} • ${v.a} • ${esc(v.g)}</small></div>`).join("")}</div><button class="reset" onclick="housePDF()">📄 House PDF</button> <button class="reset" onclick="shareHouse()">↗ Share House</button>`}
function housePDF(){let a=fam();if(!a.length)return;let w=open("","_blank");w.document.write(slipDoc(a.map(slipHtml).join(""),`House ${esc(houseEl.value)} Voter Slips`));w.document.close();setTimeout(()=>w.print(),350)}
async function shareHouse(){let a=fam();if(!a.length)return;try{let file=await makePdfFile(a,`House_${houseEl.value}_Voter_Slips.pdf`);await sharePdfFile(file,"House Voter Information Slips","मतदाता सूची संदर्भ हेतु मकान की मतदाता सूचना पर्चियां")}catch(e){alert("House PDF share तैयार नहीं हो सका: "+e.message)}}
const qel=$("q"),wardEl=$("ward"),colonyEl=$("colony"),houseEl=$("house"),resetEl=$("reset");
opts(wardEl,D.map(v=>v.w),"सभी वार्ड");
opts(colonyEl,[],"पहले वार्ड चुनें"); colonyEl.disabled=true;
opts(houseEl,[],"पहले कॉलोनी चुनें"); houseEl.disabled=true;
wardEl.addEventListener("change",updateColony);
colonyEl.addEventListener("change",updateHouse);
houseEl.addEventListener("change",()=>apply());
qel.addEventListener("input",()=>apply());
qel.addEventListener("search",()=>apply());
resetEl.addEventListener("click",()=>{qel.value="";wardEl.value="";opts(colonyEl,[],"पहले वार्ड चुनें");colonyEl.disabled=true;opts(houseEl,[],"पहले कॉलोनी चुनें");houseEl.disabled=true;apply()});
prev.onclick=()=>{if(page>1){page--;render()}};
next.onclick=()=>{if(page<Math.ceil(F.length/PER)){page++;render()}};
dPdf.onclick=()=>printV(sel);
dShare.onclick=()=>{let i=F.indexOf(sel);shareV(i)};
render();
</script>
