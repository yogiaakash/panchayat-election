<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panchayat Digital Exact Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f2;color:#15221e;font-family:"Nirmala UI",Mangal,Arial,sans-serif}.app{max-width:850px;margin:auto}.hero{padding:18px 16px;background:linear-gradient(145deg,#0d3f34,#176451);color:#fff}.hero h1{margin:4px 0}.tag{font-size:12px;font-weight:800}.candidate{margin-top:14px;padding:12px;background:#ffffff1c;border:1px solid #ffffff30;border-radius:18px}main{padding:12px}.box,.card{background:#fff;border:1px solid #dce3df;box-shadow:0 6px 20px #14413614;border-radius:18px}.search{padding:14px}.q{width:100%;height:50px;border:1px solid #bdc9c4;border-radius:13px;padding:0 12px;font-size:16px;margin:10px 0}.filters{display:grid;grid-template-columns:1fr;gap:9px}.filters label{font-size:12px;font-weight:800}.filters select{width:100%;height:45px;border:1px solid #cbd4d0;border-radius:11px;background:#fff}.reset{margin-top:10px;padding:9px 12px;border:0;border-radius:10px;background:#edf2ef;color:#124b3e;font-weight:800}.stats{margin:12px 0;padding:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:1px}.stat{text-align:center;padding:9px;background:#f8faf8}.stat b{display:block;font-size:19px;color:#124b3e}.stat span{font-size:10px;color:#6f7b76}.cards{display:grid;gap:10px}.card{padding:13px}.top{display:flex;justify-content:space-between;gap:8px}.name{font-size:18px;font-weight:900}.id{font:700 11px monospace;background:#eef3f1;padding:5px 7px;border-radius:8px}.rel{font-size:13px;color:#53625c;margin-top:4px}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.pill{font-size:11px;background:#f2f5f3;border:1px solid #e0e6e3;padding:5px 7px;border-radius:999px}.house{background:#fff7e9;color:#795018}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.actions button,.pager button{border:0;border-radius:10px;padding:9px;font-weight:800}.details{background:#edf2ef;color:#124b3e}.pdf{background:#e8f1ff;color:#184e89}.share{background:#fff0e0;color:#8c520e}.family{display:none;padding:14px;margin-bottom:12px}.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin:14px}.pager button{background:#fff;border:1px solid #cad3cf}dialog{width:min(94vw,560px);border:0;border-radius:18px}.row{display:grid;grid-template-columns:120px 1fr;padding:8px 0;border-bottom:1px solid #eee}.row span{font-size:11px;color:#6f7b76}@media(min-width:650px){.filters{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:1fr 1fr}}
</style></head><body><div class="app"><header class="hero"><div class="tag">PANCHAYAT DIGITAL</div><h1>ग्राम पंचायत रामपुरा</h1><div class="candidate"><b>राजेश शर्मा</b><div>सरपंच प्रत्याशी • ग्राम पंचायत रामपुरा</div></div></header><main>
<section class="box search"><b>🔍 मतदाता खोजें / Search Voter</b><input class="q" id="q" placeholder="नाम / Name / Voter ID"><div class="filters"><div><label>1. Ward / वार्ड</label><select id="ward"></select></div><div><label>2. Colony / कॉलोनी</label><select id="colony" disabled></select></div><div><label>3. House No. / मकान नं.</label><select id="house" disabled></select></div></div><button class="reset" id="reset">Reset Filters</button></section>
<section class="box stats"><div class="stat"><b id="total"></b><span>Voters</span></div><div class="stat"><b id="male"></b><span>Male</span></div><div class="stat"><b id="female"></b><span>Female</span></div><div class="stat"><b id="wards"></b><span>Wards</span></div><div class="stat"><b id="colonies"></b><span>Colonies</span></div><div class="stat"><b id="houses"></b><span>Houses</span></div></section>
<section id="family" class="box family"></section><div id="cards" class="cards"></div><div class="pager"><button id="prev">← Previous</button><span id="pg"></span><button id="next">Next →</button></div></main></div>
<dialog id="dlg"><h3>मतदाता विवरण</h3><div id="detail"></div><div class="actions"><button id="dPdf" class="pdf">PDF</button><button id="dShare" class="share">Share</button><button onclick="dlg.close()">Close</button></div></dialog>
<script src="voters.js"></script><script>
const D=window.VOTERS||[],$=x=>document.getElementById(x),PER=40;let F=D,page=1,sel=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\u0900-\u097f]+/g,"");
const uniq=a=>[...new Set(a.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"hi",{numeric:true}));
function opts(el,a,label){el.innerHTML='<option value="">'+label+'</option>'+uniq(a).map(x=>'<option>'+esc(x)+'</option>').join("")}
function hc(v){return D.filter(x=>x.w===v.w&&x.c===v.c&&x.h===v.h).length}
function apply(resetPage=true){
  const q=norm(qel.value.trim());
  const w=wardEl.value, c=colonyEl.value, h=houseEl.value;
  F=D.filter(v=>{
    const searchText=norm([v.n,v.r,v.id,v.h,v.c,v.b,v.w,v.s].join(" "));
    return (!w || String(v.w)===String(w)) &&
           (!c || String(v.c)===String(c)) &&
           (!h || String(v.h)===String(h)) &&
           (!q || searchText.includes(q));
  });
  if(resetPage) page=1;
  render();
}
function updateColony(){
  const w=wardEl.value;
  const rows=w ? D.filter(v=>String(v.w)===String(w)) : [];
  opts(colonyEl,rows.map(v=>v.c),"सभी कॉलोनी");
  colonyEl.disabled=!w;
  opts(houseEl,[],"पहले कॉलोनी चुनें");
  houseEl.disabled=true;
  apply();
}
function updateHouse(){
  const w=wardEl.value, c=colonyEl.value;
  const rows=(w&&c) ? D.filter(v=>String(v.w)===String(w)&&String(v.c)===String(c)) : [];
  opts(houseEl,rows.map(v=>String(v.h)),"सभी मकान");
  houseEl.disabled=!(w&&c);
  apply();
}
function card(v,i){return `<article class="card"><div class="top"><div><div class="name">${esc(v.n)}</div><div class="rel">संबंधी: ${esc(v.r)}</div></div><div class="id">${esc(v.id)}</div></div><div class="meta"><span class="pill">Ward ${esc(v.w)}</span><span class="pill">${esc(v.c)}</span><span class="pill house">🏠 ${esc(v.h)} · ${hc(v)} voters</span><span class="pill">Age ${v.a}</span><span class="pill">${esc(v.g)}</span></div><div class="actions"><button class="details" onclick="show(${i})">Details</button><button class="pdf" onclick="slip(${i})">📄 PDF</button><button class="share" onclick="shareV(${i})">↗ Share</button></div></article>`}
function render(){total.textContent=F.length;male.textContent=F.filter(v=>v.g.includes("पुर")).length;female.textContent=F.filter(v=>v.g.includes("स्त्री")||v.g.includes("महिला")).length;wards.textContent=new Set(F.map(v=>v.w)).size;colonies.textContent=new Set(F.map(v=>v.w+"|"+v.c)).size;houses.textContent=new Set(F.map(v=>v.w+"|"+v.c+"|"+v.h)).size;let st=(page-1)*PER;cards.innerHTML=F.slice(st,st+PER).map((v,j)=>card(v,st+j)).join("");pg.textContent=`Page ${page} / ${Math.max(1,Math.ceil(F.length/PER))}`;familyPanel()}
function rr(v){return [["Ward / वार्ड",v.w],["क्रम संख्या",v.s],["Voter ID",v.id],["नाम",v.n],["पिता/पति/अन्य",v.r],["मकान",v.h],["कॉलोनी",v.c],["मतदान केंद्र",v.b],["आयु",v.a],["लिंग",v.g]]}
function show(i){sel=F[i];detail.innerHTML=rr(sel).map(x=>`<div class="row"><span>${esc(x[0])}</span><b>${esc(x[1])}</b></div>`).join("");dlg.showModal()}
function printV(v,title="मतदाता पर्ची"){let w=open("","_blank");w.document.write(`<meta charset="utf-8"><h2>ग्राम पंचायत रामपुरा — ${title}</h2>`+rr(v).map(x=>`<p><b>${esc(x[0])}:</b> ${esc(x[1])}</p>`).join(""));w.document.close();setTimeout(()=>w.print(),200)}
function slip(i){printV(F[i])}async function shareV(i){let v=F[i],t=rr(v).map(x=>x[0]+": "+x[1]).join("\n");if(navigator.share)try{return await navigator.share({title:"Voter Details",text:t})}catch(e){}navigator.clipboard?.writeText(t)}
function fam(){return wardEl.value&&colonyEl.value&&houseEl.value?D.filter(v=>String(v.w)===String(wardEl.value)&&String(v.c)===String(colonyEl.value)&&String(v.h)===String(houseEl.value)):[]}
function familyPanel(){let a=fam();if(!a.length){family.style.display="none";return}family.style.display="block";family.innerHTML=`<b>🏠 मकान ${esc(houseEl.value)} — ${a.length} मतदाता</b><div style="font-size:12px;color:#6f7b76">${esc(colonyEl.value)} • Ward ${esc(wardEl.value)}</div><div style="margin-top:8px">${a.map(v=>`<div style="padding:6px 0;border-top:1px solid #eee"><b>${esc(v.n)}</b> · ${esc(v.id)}<br><small>${esc(v.r)} • ${v.a} • ${esc(v.g)}</small></div>`).join("")}</div><button class="reset" onclick="housePDF()">📄 House PDF</button> <button class="reset" onclick="shareHouse()">↗ Share House</button>`}
function housePDF(){
 let a=fam(); if(!a.length)return;
 let w=open("","_blank");
 const slip=v=>`<section class="vslip">
   <div class="gp">ग्राम पंचायत रामपुरा</div>
   <div class="cand">राजेश कुमार शर्मा</div>
   <div class="appeal">आपका सहयोग, रामपुरा के विकास के लिए</div>
   <div class="mark">🗳️ आपका अमूल्य मत लोकतंत्र की पहचान है</div>
   <div class="title">मतदाता पर्ची / Voter Slip</div>
   <div class="ref">For voter-list reference only</div>
   <div class="rows">
    <div><b>Ward / वार्ड</b><span>${esc(v.w)}</span></div>
    <div><b>Serial / क्रमांक</b><span>${esc(v.s)}</span></div>
    <div><b>Voter ID</b><span>${esc(v.id)}</span></div>
    <div><b>मतदाता का नाम / Name</b><span>${esc(v.n)}</span></div>
    <div><b>पिता/पति/अन्य / Relative</b><span>${esc(v.r)}</span></div>
    <div><b>मकान नंबर / House No.</b><span>${esc(v.h)}</span></div>
    <div><b>कॉलोनी / Colony</b><span>${esc(v.c)}</span></div>
    <div class="wide"><b>मतदान केंद्र / Polling Station</b><span>${esc(v.b)}</span></div>
    <div><b>आयु / Age</b><span>${esc(v.a)}</span></div>
    <div><b>लिंग / Gender</b><span>${esc(v.g)}</span></div>
   </div>
  </section>`;
 w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>House ${esc(houseEl.value)} Voter Slips</title><style>
 @page{size:A4;margin:7mm}*{box-sizing:border-box}body{margin:0;font-family:"Nirmala UI",Mangal,Arial,sans-serif;color:#111}.vslip{border:1.5px dashed #666;padding:8mm 7mm;margin:0 0 5mm;break-inside:avoid;page-break-inside:avoid}.gp{text-align:center;font-size:19px;font-weight:900}.cand{text-align:center;font-size:16px;font-weight:800;margin-top:2px}.appeal,.mark{text-align:center;font-size:11px;margin-top:2px}.title{text-align:center;font-size:17px;font-weight:900;margin-top:6px}.ref{text-align:center;font-size:10px;margin:1px 0 7px;color:#444}.rows{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #bbb;border-left:1px solid #bbb}.rows>div{display:grid;grid-template-columns:44% 56%;min-height:30px;border-right:1px solid #bbb;border-bottom:1px solid #bbb;align-items:center}.rows b{font-size:10px;padding:5px;background:#f3f3f3;height:100%;display:flex;align-items:center}.rows span{font-size:11px;font-weight:700;padding:5px;overflow-wrap:anywhere}.rows .wide{grid-column:1/-1;grid-template-columns:22% 78%}@media print{.vslip{margin-bottom:4mm}}
 </style></head><body>${a.map(slip).join("")}</body></html>`);
 w.document.close();setTimeout(()=>w.print(),350)
}
async function shareHouse(){let a=fam(),t=a.map((v,i)=>`${i+1}. ${v.n} | ${v.id} | ${v.r}`).join("\n");if(navigator.share)try{return await navigator.share({title:"House Voter List",text:t})}catch(e){}navigator.clipboard?.writeText(t)}
const qel=$("q"),wardEl=$("ward"),colonyEl=$("colony"),houseEl=$("house"),resetEl=$("reset");
opts(wardEl,D.map(v=>v.w),"सभी वार्ड");
opts(colonyEl,[],"पहले वार्ड चुनें"); colonyEl.disabled=true;
opts(houseEl,[],"पहले कॉलोनी चुनें"); houseEl.disabled=true;
wardEl.addEventListener("change",updateColony);
colonyEl.addEventListener("change",updateHouse);
houseEl.addEventListener("change",()=>apply());
qel.addEventListener("input",()=>apply());
qel.addEventListener("search",()=>apply());
resetEl.addEventListener("click",()=>{qel.value="";wardEl.value="";opts(colonyEl,[],"पहले वार्ड चुनें");colonyEl.disabled=true;opts(houseEl,[],"पहले कॉलोनी चुनें");houseEl.disabled=true;apply()});
prev.onclick=()=>{if(page>1){page--;render()}};
next.onclick=()=>{if(page<Math.ceil(F.length/PER)){page++;render()}};
dPdf.onclick=()=>printV(sel);
dShare.onclick=()=>{let i=F.indexOf(sel);shareV(i)};
render();
</script></body></html>
