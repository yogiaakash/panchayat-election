<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Get Panchayat Digital</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,"Nirmala UI",sans-serif;margin:0;background:#eef8f4;color:#123}.wrap{max-width:850px;margin:35px auto;padding:18px}.card{background:#fff;border:1px solid #d6e8e1;border-radius:20px;padding:22px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,select,button{width:100%;padding:12px;border:1px solid #cbded7;border-radius:10px;box-sizing:border-box}button{background:#087451;color:#fff;font-weight:800;border:0}.steps{display:flex;gap:7px;flex-wrap:wrap}.steps span{background:#e5f5ef;padding:8px 11px;border-radius:20px;font-size:13px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class=wrap><h1>अपनी पंचायत के लिए Panchayat Digital</h1><div class=steps><span>1 Demo</span><span>2 Panchayat</span><span>3 Payment</span><span>4 Details</span><span>5 Approval</span><span>6 Login</span></div><div class=card><h2>Purchase Request</h2><div class=grid><div><label>Candidate Name</label><input id=name></div><div><label>Hindi Name</label><input id=hindi></div><div><label>Post</label><select id=post><option>Sarpanch</option><option>Ward Panch</option><option>Panchayat Samiti Member</option><option>Zila Parishad Member</option></select></div><div><label>District</label><input id=district></div><div><label>Panchayat Samiti</label><input id=ps></div><div><label>Gram Panchayat</label><input id=gp></div><div><label>Mobile</label><input id=mobile></div><div><label>Email</label><input id=email type=email></div><div><label>Package</label><select id=pkg><option value=basic>Basic — ₹4,999</option><option value=standard>Standard — ₹6,999</option><option value=premium>Premium — ₹9,999</option></select></div><div><label>Payment / UTR Reference</label><input id=utr></div><div><label>Candidate Photo</label><input id=photo type=file accept="image/*"></div><div><label>Payment Screenshot</label><input id=proof type=file accept="image/*"></div></div><p>Payment verify होने के बाद Admin account activate करेगा.</p><button onclick=submitReq()>Submit Purchase Request</button><p id=msg></p></div></div><script>const {createClient}=supabase;const sb=createClient("https://ieoltipygxawhsvlxnsj.supabase.co","sb_publishable_AzM0AxHgmX2a6-9On5jgNg_7SuasTXH");const el=x=>document.getElementById(x);async function fo(f){if(!f)return null;return await new Promise((res,rej)=>{const r=new FileReader;r.onload=()=>res({name:f.name,content_type:f.type,base64:String(r.result).split(",")[1]});r.onerror=rej;r.readAsDataURL(f)})}async function submitReq(){msg.textContent="Submitting…";const body={candidate_name:el("name").value,hindi_name:el("hindi").value,post:el("post").value,district:el("district").value,panchayat_samiti:el("ps").value,gram_panchayat:el("gp").value,mobile:el("mobile").value,email:el("email").value,package_code:el("pkg").value,payment_reference:el("utr").value,photo:await fo(el("photo").files[0]),payment_proof:await fo(el("proof").files[0])};const {data,error}=await sb.functions.invoke("submit-purchase-request",{body});if(error||data?.error){msg.textContent="Error: "+(data?.error||error.message);return}msg.innerHTML="<b>Request submitted.</b><br>Request ID: "+data.id+"<br>Admin approval के बाद login activate होगा."}</script></body></html>
