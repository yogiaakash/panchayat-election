/></noscript><div class="wrap"><div class="card"><h1>Set New Password</h1><div class="muted">अपने Panchayat Digital account के लिए नया password बनाएं।</div>
<div id="form" class="hidden"><label>New Password</label><input id="pw" type="password" minlength="6" autocomplete="new-password" placeholder="Minimum 6 characters">
<label>Confirm Password</label><input id="pw2" type="password" minlength="6" autocomplete="new-password" placeholder="Password फिर से लिखें">
<button id="save" class="btn">Update Password</button></div><div id="msg" class="msg">Recovery link verify हो रहा है…</div>
<a class="back" href="./admin/">Back to Admin Login</a></div></div>
<script>
const SUPABASE_URL="https://ieoltipygxawhsvlxnsj.supabase.co", SUPABASE_PUBLISHABLE_KEY="sb_publishable_AzM0AxHgmX2a6-9On5jgNg_7SuasTXH";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const form=document.getElementById("form"),msg=document.getElementById("msg"),save=document.getElementById("save");
function showError(t){msg.className="msg err";msg.textContent=t;form.classList.add("hidden")}
async function init(){
 try{
  const hp=new URLSearchParams(location.hash.slice(1));
  const access=hp.get("access_token"), refresh=hp.get("refresh_token");
  if(access&&refresh){
   const {error}=await sb.auth.setSession({access_token:access,refresh_token:refresh});
   if(error)throw error;
   history.replaceState(null,"",location.pathname);
  }else{
   const code=new URLSearchParams(location.search).get("code");
   if(code){
    const {error}=await sb.auth.exchangeCodeForSession(code);
    if(error)throw error;
    history.replaceState(null,"",location.pathname);
   }
  }
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return showError("Recovery link invalid या expire हो चुका है। नया recovery email भेजें।");
  msg.textContent="";form.classList.remove("hidden");
 }catch(e){showError("Recovery link verify नहीं हुआ: "+(e?.message||e))}
}
save.onclick=async()=>{
 const p=document.getElementById("pw").value,p2=document.getElementById("pw2").value;
 msg.className="msg";
 if(p.length<6){msg.className="msg err";msg.textContent="Password कम से कम 6 characters का रखें।";return}
 if(p!==p2){msg.className="msg err";msg.textContent="दोनों passwords match नहीं कर रहे।";return}
 save.disabled=true;save.textContent="Updating…";
 const {error}=await sb.auth.updateUser({password:p});
 if(error){msg.className="msg err";msg.textContent="Password update नहीं हुआ: "+error.message;save.disabled=false;save.textContent="Update Password";return}
 await sb.auth.signOut();
 form.classList.add("hidden");msg.className="msg ok";msg.innerHTML="Password successfully updated.<br>अब नए password से Admin Login करें।";
 save.disabled=false;save.textContent="Update Password";
};
init();
</script></body></html>
